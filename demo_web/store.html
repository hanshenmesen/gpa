            </div>
          </details>
          <div class="report-area"><button class="ghost" type="button" id="reportRecord">举报内容或安全问题</button></div>
        </div>
      `;
      document.getElementById('saveRecord')?.addEventListener('click', () => saveSelectedRecord().catch(error => showSaveFeedback(error.message, 'error')));
      document.getElementById('runBenchmark')?.addEventListener('click', () => startBenchmarkRun().catch(error => showBenchmarkRunError(error.message)));
      document.getElementById('stopBenchmark')?.addEventListener('click', () => stopBenchmarkRun().catch(error => showBenchmarkRunError(error.message)));
      document.getElementById('auditReproduction')?.addEventListener('click', () => runIsolatedAudit().catch(error => showIsolatedAuditError(error.message)));
      document.getElementById('reportRecord')?.addEventListener('click', openReportDialog);
      bindDetailClose();
      updateBenchmarkRunControls();
    }

    function openReportDialog() {
      if (!state.selected) return;
      els.reportCategory.value = '';
      els.reportDetails.value = '';
      els.reportFeedback.innerHTML = '';
      if (!els.reportDialog.open) els.reportDialog.showModal();
      requestAnimationFrame(() => els.reportCategory.focus({ preventScroll: true }));
    }

    function closeReportDialog() {
      if (els.reportDialog.open) els.reportDialog.close();
    }

    async function submitReport(event) {
      event.preventDefault();
      const recordId = state.selected?.record_id;
      if (!recordId || !els.reportCategory.value) return;
      const button = document.getElementById('submitReport');
      button.disabled = true;
      els.reportFeedback.innerHTML = '<div class="feedback">正在提交…</div>';
      try {
        const reportId = `rpt_${globalThis.crypto?.randomUUID?.().replaceAll('-', '').slice(0, 16) || `${Date.now()}local`}`;
        const data = await postJson(`/api/community/records/${encodeURIComponent(recordId)}/report`, {
          category: els.reportCategory.value,
          details: els.reportDetails.value.trim(),
          report_id: reportId,
        });
        els.reportFeedback.innerHTML = `<div class="feedback">已收到，编号 ${escapeHtml(data.report.report_id)}。${data.report.record_status === 'restricted' ? '该内容已临时限制，等待复核。' : ''}</div>`;
        window.setTimeout(() => { closeReportDialog(); loadStore({ preserveSelection: false }).catch(showStoreLoadError); }, 900);
      } catch (error) {
        els.reportFeedback.innerHTML = `<div class="feedback error">${escapeHtml(error.message)}</div>`;
      } finally {
        button.disabled = false;
      }
    }

    function showSaveFeedback(message, kind = '') {
      const target = document.getElementById('saveFeedback');
      if (target) target.innerHTML = `<div class="feedback state-message ${kind === 'error' ? 'is-error' : kind === 'warn' ? 'is-warning' : 'is-success'}">${escapeHtml(message)}</div>`;
    }

    function updateBenchmarkRunControls() {
      const start = document.getElementById('runBenchmark');
      const stop = document.getElementById('stopBenchmark');
      const feedback = document.getElementById('benchmarkRunStatus');
      if (!start || !stop || !feedback || !state.selected) return;
      const workflowId = state.selected.saved_workflow_id || state.selected.workflow_id || '';
      const safeWebReady = state.selected.safe_web?.runnable === true;
      const run = state.runtimeStatus?.run || {};
      const runtimeUnavailable = state.runtimeStatus?.unavailable === true;
      const isCurrent = Boolean(run.workflow_id && run.workflow_id === workflowId);
      start.disabled = runtimeUnavailable || !safeWebReady || !state.selected.saved_workflow_id || Boolean(run.active);
      stop.disabled = runtimeUnavailable || !(run.active && isCurrent && run.execution_mode === 'safe_web');
      feedback.className = 'benchmark-run-status';
      if (runtimeUnavailable) {
        feedback.classList.add('error');
        feedback.textContent = '运行服务暂不可用，恢复连接后才能开始验证。';
      } else if (run.active && isCurrent) {
        const step = run.current_step?.number || run.steps_run || 0;
        feedback.classList.add('running');
        feedback.textContent = `正在验证：${run.status || 'running'} · ${step}/${run.total_steps || state.selected.step_count || 0} 步 · ${run.elapsed_seconds || 0}s`;
      } else if (run.active) {
        feedback.classList.add('running');
        feedback.textContent = `另一个任务正在运行：${run.workflow_id || 'unknown'}。完成后可运行当前案例。`;
      } else if (isCurrent && run.run_id) {
        const succeeded = run.success === true;
        feedback.classList.add(succeeded ? 'success' : 'error');
        feedback.textContent = succeeded
          ? `验证通过：${run.steps_run || 0} 步，${run.elapsed_seconds || 0}s，零桌面输入。`
          : `${run.failure_category === 'external_blocker' ? '外部网站阻止复现' : '验证失败'}：${run.error || run.status || 'unknown'}`;
      } else {
        const reproduction = state.selected.reproduction || {};
        if (['succeeded', 'passed', 'success'].includes(reproduction.status)) feedback.classList.add('success');
        if (reproduction.status === 'failed' || reproduction.status === 'external-blocked') feedback.classList.add('error');
        feedback.textContent = reproduction.label
          ? `最近结果：${reproduction.label}${reproduction.steps_run ? ` · ${reproduction.steps_run} 步` : ''}`
          : (state.selected.saved_workflow_id ? '等待运行。' : '请先保存到“我的回放”，再执行验证。');
      }
    }

    function showBenchmarkRunError(message) {
      const feedback = document.getElementById('benchmarkRunStatus');
      if (!feedback) return;
      feedback.className = 'benchmark-run-status error';
      feedback.textContent = message || '验证启动失败。';
    }

    function showIsolatedAuditError(message) {
      const feedback = document.getElementById('isolatedAuditStatus');
      const button = document.getElementById('auditReproduction');
      if (button) {
        button.disabled = false;
        button.removeAttribute('aria-busy');
        button.textContent = button.dataset.idleLabel || '运行隔离 Agent 审计';
      }
      if (!feedback) return;
      feedback.className = 'benchmark-run-status error';
      feedback.textContent = message || '隔离复现审计失败。';
    }

    function runIsolatedAudit() {
      return runStoreAction('selected-record', '隔离复现审计', runIsolatedAuditOnce);
    }

    async function runIsolatedAuditOnce() {
      const record = state.selected;
      if (!record || record.record_id !== state.selectedId) return;
      const recordId = record.record_id;
      const version = state.selectionVersion;
      const button = document.getElementById('auditReproduction');
      const feedback = document.getElementById('isolatedAuditStatus');
      if (button) {
        button.dataset.idleLabel = button.textContent;
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        button.textContent = '正在隔离导入并访问真实来源…';
      }
      if (feedback) {
        feedback.className = 'benchmark-run-status running';
        feedback.textContent = '正在创建全新 Agent 工作区、校验录屏和执行成功条件。';
      }
      const data = await postJson(`/api/community/records/${encodeURIComponent(recordId)}/audit`, {
        client_environment: clientEnvironmentSnapshot(),
      }, { timeoutMs: 300000 });
      if (version !== state.selectionVersion || state.selectedId !== recordId) return;
      state.selected.isolated_reproduction_audit = data.summary;
      const summary = state.records.find(item => item.record_id === recordId);
      if (summary) summary.isolated_reproduction_audit = data.summary;
      renderCatalog();
      renderDetail();
      const result = document.getElementById('isolatedAuditStatus');
      if (result) {
        result.className = `benchmark-run-status ${data.summary.cross_agent_reproducible ? 'success' : 'error'}`;
        result.textContent = data.summary.cross_agent_reproducible
          ? `隔离复现通过：${data.summary.execution.steps_run} 步，零桌面输入。`
          : `隔离复现未通过：${data.summary.execution.error || data.summary.status}`;
      }
    }

    function startBenchmarkRun() {
      return runStoreAction('selected-record', '启动安全验证', startBenchmarkRunOnce);
    }

    async function startBenchmarkRunOnce() {
      const record = state.selected;
      const workflowId = record?.saved_workflow_id || '';
      if (!record || record.record_id !== state.selectedId || !workflowId) {
        throw new Error('请先导入该案例并生成复现计划。');
      }
      if (record.safe_web?.runnable !== true) {
        throw new Error(record.safe_web?.reason || '该案例当前不能安全运行。');
      }
      const button = document.getElementById('runBenchmark');
      const idleLabel = button?.textContent || '运行安全复现';
      if (button) {
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        button.textContent = '正在启动验证…';
      }
      try {
        await sendStoreHeartbeat();
        const arm = await postJson('/api/run/arm', {
          workflow_id: workflowId,
          client_id: STORE_CLIENT_ID,
        }, { timeoutMs: 20000 });
        await postJson(`/api/workflows/${encodeURIComponent(workflowId)}/run`, {
          arm_token: arm.arm_token,
          client_id: STORE_CLIENT_ID,
          execution_mode: 'safe_web',
          countdown_seconds: 0,
          max_runtime_seconds: 180,
          client_environment: clientEnvironmentSnapshot(),
        }, { timeoutMs: 60000 });
      } finally {
        const statusApplied = await loadHeaderStatus();
        if (button?.isConnected) {
          button.removeAttribute('aria-busy');
          button.textContent = idleLabel;
          if (!statusApplied) button.disabled = true;
        }
      }
    }

    function stopBenchmarkRun() {
      return runStoreAction('selected-record', '停止安全验证', stopBenchmarkRunOnce);
    }

    async function stopBenchmarkRunOnce() {
      const run = state.runtimeStatus?.run || {};
      const workflowId = state.selected?.saved_workflow_id || state.selected?.workflow_id || '';
      if (!run.active || run.workflow_id !== workflowId || run.execution_mode !== 'safe_web') return;
      const button = document.getElementById('stopBenchmark');
      const idleLabel = button?.textContent || '停止验证';
      if (button) {
        button.disabled = true;
        button.setAttribute('aria-busy', 'true');
        button.textContent = '正在停止…';
      }
      try {
        await postJson('/api/run/stop', {}, { timeoutMs: 20000 });
      } finally {
        const statusApplied = await loadHeaderStatus();
        if (button?.isConnected) {
          button.removeAttribute('aria-busy');
          button.textContent = idleLabel;
          if (!statusApplied) button.disabled = true;
        }
      }
    }

    function saveSelectedRecord() {
      return runStoreAction('selected-record', '保存 Replay', saveSelectedRecordOnce);
    }

    async function saveSelectedRecordOnce() {
      const record = state.selected;
      if (!record || record.record_id !== state.selectedId) return;
      const recordId = record.record_id;
      const version = state.selectionVersion;
      const button = document.getElementById('saveRecord');
      if (button) { button.disabled = true; button.textContent = '正在保存…'; }
      try {
        const data = await postJson(`/api/community/records/${encodeURIComponent(recordId)}/import`, {
          client_environment: clientEnvironmentSnapshot(),
        }, { timeoutMs: 120000 });
        if (version !== state.selectionVersion || state.selectedId !== recordId) return;
        state.selected.saved_workflow_id = data.workflow_id;
        state.selected.import_gate = data.workflow?.reproduction_gate || null;
        const summary = state.records.find(item => item.record_id === recordId);
        if (!data.already_saved) {
          const nextImports = Number(state.selected.stats?.imports || 0) + 1;
          state.selected.stats = { ...(state.selected.stats || {}), imports: nextImports };
          if (summary) summary.stats = { ...(summary.stats || {}), imports: nextImports };
        }
        if (summary) summary.saved_workflow_id = data.workflow_id;
        if (summary) summary.import_gate = data.workflow?.reproduction_gate || null;
        renderCatalog();
        renderDetail();
        const gate = data.workflow?.reproduction_gate || {};
        const gateLabel = gate.status === 'ready' ? '当前环境可直接复现' : gate.status === 'adaptation_required' ? '已生成环境适配计划' : gate.status === 'blocked' ? '需要重新规划后运行' : '需要人工审核证据';
        showSaveFeedback(data.already_saved ? `已更新复现计划：${gateLabel}。` : `导入完成：${gateLabel}。`);
        await loadLocalWorkflows();
      } catch (error) {
        if (version === state.selectionVersion && state.selectedId === recordId && button) {
          button.disabled = false;
          button.textContent = '保存到我的 Replay';
        }
        throw error;
      }
    }

    function formatBytes(value) {
      const bytes = Number(value || 0);
      if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MiB`;
      if (bytes >= 1024) return `${(bytes / 1024).toFixed(1)} KiB`;
      return `${bytes} B`;
    }

    function updatePackagePublishState() {
      const contract = state.stagedPackageInspection?.reproduction_contract || {};
      const ready = contract.publishable_as_verified === true;
      els.confirmPackageUpload.disabled = !(
        state.stagedPackageFile && state.stagedPackageInspection?.inspection_token && publisherDeclarationReady() && ready
      );
      els.confirmPackageUpload.textContent = state.stagedPackageInspection
        ? ready ? '发布为可复现插件' : '证据未达发布标准'
        : '确认发布检查过的包';
      els.confirmPackageUpload.title = state.stagedPackageInspection && !ready
        ? `未通过：${contractBlockers(contract)}`
        : '';
    }

    function clearStagedPackage() {
      state.stagedPackageFile = null;
      state.stagedPackageInspection = null;
      els.packageFile.value = '';
      els.packageInspection.classList.remove('visible');
      els.packageInspection.innerHTML = '';
      els.dropzoneState.textContent = '最大 64 MiB';
      updatePackagePublishState();
    }

    function renderPackageInspection(inspection, file) {
      const evidence = inspection.evidence || {};
      const safetyScan = inspection.safety_scan || {};
      const recording = evidence.recording || {};
      const sourceTrace = evidence.source_trace || {};
      const capture = recordingScope(recording);
      const privacy = recordingPrivacy(recording);
      const captureMethod = recordingMethod(recording);
      const mediaProbe = evidence.recording_media_probe || {};
      const environmentDiff = evidence.environment_diff || {};
      const agentUnderstanding = evidence.agent_understanding || {};
      const contract = inspection.reproduction_contract || evidence.reproduction_contract || {};
      const interactionProfile = agentUnderstanding.interaction_profile || {};
      const riskControls = agentUnderstanding.risk_controls || {};
      const semanticPlan = agentUnderstanding.semantic_plan || [];
      const actionCounts = interactionProfile.action_counts || {};
      const apps = evidence.required_applications || [];
      const hosts = evidence.required_web_hosts || [];
      const measuredWidth = Number(mediaProbe.width || recording.width || 0);
      const measuredHeight = Number(mediaProbe.height || recording.height || 0);
      const measuredDuration = Number(mediaProbe.duration_seconds || recording.duration_seconds || 0);
      const dimensions = measuredWidth && measuredHeight ? `${measuredWidth}×${measuredHeight}` : '尺寸未记录';
      const duration = measuredDuration ? `${measuredDuration.toFixed(1)} 秒` : '时长未记录';
      const compatibilityLabels = {
        compatible: '当前环境兼容', degraded: '存在可适配差异', blocked: '存在阻断差异', unknown: '环境信息不足',
      };
      const inspectedEnvironment = evidence.environment || {};
      const inspectedSystem = inspectedEnvironment.system || {};
      const inspectedBrowser = inspectedEnvironment.browser || {};
      const inspectedCapture = inspectedEnvironment.capture_surface || {};
      const inspectedScreen = inspectedEnvironment.screen || {};
      const inspectedDimensions = inspectedCapture.width && inspectedCapture.height
        ? `${inspectedCapture.width}×${inspectedCapture.height}（录屏捕获面）`
        : inspectedBrowser.viewport_width && inspectedBrowser.viewport_height
          ? `${inspectedBrowser.viewport_width}×${inspectedBrowser.viewport_height}（浏览器视口）`
          : inspectedScreen.width && inspectedScreen.height
            ? `${inspectedScreen.width}×${inspectedScreen.height}（物理屏幕）`
            : '捕获尺寸未记录';
      const environmentEvidenceText = [
        inspectedSystem.name || '未知系统',
        inspectedSystem.machine || '机器架构未记录',
        inspectedDimensions,
        inspectedBrowser.family || '浏览器未记录',
        compatibilityLabels[environmentDiff.status] || environmentDiff.status || '待比较',
      ].join(' · ');
      const evidenceCard = (available, title, text) => `
        <div class="evidence-item ${available ? '' : 'missing'}">
          <strong>${available ? '✓' : '缺少'} ${escapeHtml(title)}</strong>
          <span>${escapeHtml(text)}</span>
        </div>`;
      const differences = (environmentDiff.differences || []).slice(0, 5).map(item => {
        const scale = item.scale_hint ? ` · 建议缩放 ${item.scale_hint.x}×${item.scale_hint.y}` : '';
        return `<div class="environment-difference ${escapeHtml(item.severity || '')}"><strong>${escapeHtml(item.field)}</strong>：${escapeHtml(item.recorded)} → ${escapeHtml(item.current)}${escapeHtml(scale)}</div>`;
      }).join('');
      const adaptationPlan = (environmentDiff.adaptation_plan || []).slice(0, 5).map(item => (
        `<div class="environment-difference"><strong>${escapeHtml(item.strategy || '适配')}</strong>：${escapeHtml(item.action || '')}</div>`
      )).join('');
      const actionProof = Object.entries(actionCounts).map(([action, count]) => (
        `<span>${escapeHtml(action)} × ${escapeHtml(count)}</span>`
      )).join('');
      const criteriaProof = (agentUnderstanding.success_criteria || []).slice(0, 5).map(item => (
        `<div>第 ${escapeHtml(item.step)} 步 · ${escapeHtml(item.type)} · ${escapeHtml(item.expected || item.description || '')}</div>`
      )).join('');
      const semanticProof = semanticPlan.slice(0, 6).map(item => (
        `<div><b>${escapeHtml(String(item.phase || '').toUpperCase())}</b> · 第 ${escapeHtml(item.step)} 步 · ${escapeHtml(item.intent || item.action_type || '')}</div>`
      )).join('');
      const previewUrl = safeHttpUrl(inspection.recording_preview_url) || (
        String(inspection.recording_preview_url || '').startsWith('/') ? inspection.recording_preview_url : ''
      );
      const contractLabels = {
        verified: '当前环境可直接复现', adaptation_required: '证据完整，需要按计划适配',
        environment_unknown: '证据完整，等待目标环境比较', incomplete: '证据不完整，不能认证发布',
      };
      const contractChecks = (contract.checks || []).map(item => (
        `<span class="contract-check ${item.passed ? '' : 'failed'}">${item.passed ? '✓' : '×'} ${escapeHtml(item.label || item.id)}</span>`
      )).join('');
      els.packageInspection.innerHTML = `
        <div class="inspection-head">
          <div>
            <h3>${escapeHtml(inspection.workflow_title || inspection.workflow_name || file.name)}</h3>
            <p>${escapeHtml(file.name)} · ${formatBytes(inspection.package_bytes)} · ${Number(inspection.step_count || 0)} 步</p>
          </div>
          <span class="source-badge">快照与容器已校验</span>
        </div>
        <div class="contract-gate ${contract.publishable_as_verified ? '' : 'incomplete'}">
          <div class="contract-score" style="--score:${Number(contract.score || 0)}">${Number(contract.score || 0)}</div>
          <div class="contract-copy">
            <strong>跨 Agent 可复现契约 · ${escapeHtml(contractLabels[contract.status] || contract.status || '正在计算')}</strong>
            <p>${contract.publishable_as_verified ? '录屏、原环境、任务理解和验收条件已形成机器可读交接包。' : '此文件可以检查，但缺少关键证据，不能以“已验证可复现插件”发布。'}</p>
            <div class="contract-checks">${contractChecks}</div>
          </div>
        </div>
        <div class="evidence-grid">
          ${evidenceCard(safetyScan.passed === true, '社区内容安全扫描', safetyScan.passed === true ? `未发现密钥、私钥或危险执行动作 · 已扫描 ${formatBytes(safetyScan.scanned_bytes)}` : `${Number(safetyScan.finding_count || 0)} 个阻断问题，发布前必须移除`)}
          ${evidenceCard(evidence.recording_media_verified, '可解码真实运行视频', evidence.has_recording ? `${duration} · ${dimensions} · ${formatBytes(recording.bytes)} · ${capture.label} · 解码 ${Number(mediaProbe.decoded_sample_count || 0)}/${Number(mediaProbe.sample_count || 0)} 个抽样画面${evidence.recording_media_verified ? '' : ` · ${mediaProbe.error || '视频不可验证'}`}` : '其他 Agent 将看不到原始操作过程')}
          ${evidenceCard(evidence.has_source_trace || recording.capture_scope !== 'public-web-evidence', '公开来源机读证据链', evidence.has_source_trace ? `${Number(sourceTrace.verified_page_count || 0)}/${Number(sourceTrace.page_count || 0)} 个页面已绑定到运行 ${sourceTrace.source_run_id || 'unknown'}` : recording.capture_scope === 'public-web-evidence' ? '公开来源证据视频缺少 source_trace.json' : '当前是直接屏幕录制，不要求 Safe Web source trace')}
          ${evidenceCard(privacy.passed, '捕获与隐私范围', evidence.has_recording ? `${capture.label} · ${captureMethod} · ${privacy.label}` : '没有可检查的录屏范围')}
          ${evidenceCard(evidence.has_environment, '录制环境', evidence.has_environment ? environmentEvidenceText : '无法比较机器与窗口差异')}
          ${evidenceCard(evidence.has_understanding, 'Agent 理解', evidence.has_understanding ? `${apps.length} 个应用 · ${hosts.length} 个站点` : '缺少目标、依赖和适配说明')}
          ${evidenceCard(Number(evidence.success_criteria_count) > 0, '成功条件', `${Number(evidence.success_criteria_count || 0)} 个可验证检查点 · ${evidence.read_only ? '只读任务' : '可能修改外部状态'}`)}
        </div>
        ${differences ? `<div class="environment-differences">${differences}</div>` : `<div class="environment-differences"><div class="environment-difference"><strong>${escapeHtml(compatibilityLabels[environmentDiff.status] || '环境比较')}</strong>：未发现需要适配的关键差异。</div></div>`}
        ${adaptationPlan ? `<div class="environment-differences"><div class="mini-label">Agent 适配计划</div>${adaptationPlan}</div>` : ''}
        <div class="inspection-proof">
          <div class="agent-proof">
            <h4>Agent 对任务的可移植理解</h4>
            <p>${escapeHtml(agentUnderstanding.goal || inspection.task_description || '未提供任务目标')}</p>
            <div class="action-proof">${actionProof || '<span>无动作摘要</span>'}</div>
            <div class="mini-label">可移植语义计划</div>
            <div class="criteria-proof">${semanticProof || '<div>未附带逐步语义计划。</div>'}</div>
            <div class="mini-label" style="margin-top:9px">验收条件</div>
            <div class="criteria-proof">${criteriaProof || '<div>未附带可验证的成功条件。</div>'}</div>
            <p style="margin-top:8px">风险：${riskControls.read_only ? '只读' : '可能修改外部状态，需要显式授权'} · 复现需求：${escapeHtml(apps.join(' · ') || '通用')} · ${escapeHtml(hosts.join(' · ') || '无固定站点')}</p>
          </div>
          <div class="recording-proof">
            <h4>发布前播放真实录屏</h4>
            <p>${evidence.has_recording ? `视频来自当前已校验快照，不是元数据占位符。捕获范围：${escapeHtml(capture.label)}；${escapeHtml(privacy.label)}。` : '此包未提供视频，发布后其他 Agent 无法观看原始操作。'}</p>
            ${previewUrl ? `<video class="inspection-recording" controls preload="metadata" src="${escapeHtml(previewUrl)}"></video>` : ''}
            <div class="snapshot-proof">SHA-256 ${escapeHtml(inspection.package_sha256 || '')}<br>快照 ${Math.round(Number(inspection.expires_in_seconds || 0) / 60)} 分钟后过期</div>
          </div>
        </div>
        <div class="feedback">确认发布只会使用这份已检查快照，不会再次上传或替换文件。</div>
        <div class="upload-progress" hidden><span></span></div>`;
      els.packageInspection.classList.add('visible');
    }

    async function inspectCommunityPackage(file) {
      if (!file) return;
      const requestVersion = ++state.packageInspectionVersion;
      state.packageInspectionRequest?.abort();
      clearStagedPackage();
      if (file.size > 64 * 1024 * 1024) throw new Error('社区包不能超过 64 MiB。');
      els.dropzoneState.textContent = `检查 ${file.name}`;
      showPublishFeedback(`正在检查 ${file.name} 的结构和证据…`);
      const clientEnvironment = clientEnvironmentQuery();
      let data;
      try {
        data = await streamPackageInspection(file, clientEnvironment, value => {
          if (requestVersion === state.packageInspectionVersion) showPublishFeedback(`正在上传并检查 ${file.name}… ${value}%`);
        });
      } catch (error) {
        if (requestVersion !== state.packageInspectionVersion) return false;
        throw error;
      }
      if (requestVersion !== state.packageInspectionVersion) return false;
      state.stagedPackageFile = file;
      state.stagedPackageInspection = data.inspection;
      renderPackageInspection(data.inspection, file);
      updatePackagePublishState();
      els.dropzoneState.textContent = data.inspection.reproduction_contract?.publishable_as_verified
        ? '证据完整，可发布'
        : '证据不完整';
      showPublishFeedback('检查完成。请核对证据、勾选隐私确认，再发布。');
      return true;
    }

    function streamPackageInspection(file, clientEnvironment, onProgress) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        state.packageInspectionRequest = request;
        request.timeout = 180000;
        request.open('POST', `${API_BASE}/api/community/inspect?${clientEnvironment}`);
        request.setRequestHeader('Content-Type', 'application/zip');
        request.upload.addEventListener('progress', event => {
          if (event.lengthComputable) onProgress(Math.round(event.loaded / event.total * 100));
        });
        request.addEventListener('load', () => {
          if (state.packageInspectionRequest === request) state.packageInspectionRequest = null;
          let data = {};
          try { data = JSON.parse(request.responseText || '{}'); } catch (_) {}
          if (request.status < 200 || request.status >= 300 || data.ok === false) {
            reject(new Error(data.error || request.statusText || '检查失败'));
            return;
          }
          resolve(data);
        });
        request.addEventListener('error', () => {
          if (state.packageInspectionRequest === request) state.packageInspectionRequest = null;
          reject(new Error('网络连接中断，包未完成检查。'));
        });
        request.addEventListener('abort', () => {
          if (state.packageInspectionRequest === request) state.packageInspectionRequest = null;
          reject(new Error('检查已取消。'));
        });
        request.addEventListener('timeout', () => {
          if (state.packageInspectionRequest === request) state.packageInspectionRequest = null;
          reject(new Error('包检查等待时间过长，请重试。'));
        });
        request.send(file);
      });
    }

    function downloadCommunityPackage(recordId, onProgress) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.timeout = 180000;
        request.open('GET', `${API_BASE}/api/community/records/${encodeURIComponent(recordId)}/download`);
        request.responseType = 'blob';
        request.addEventListener('progress', event => {
          if (event.lengthComputable) onProgress(Math.round(event.loaded / event.total * 100));
        });
        request.addEventListener('load', () => {
          if (request.status < 200 || request.status >= 300) {
            reject(new Error(`真实录屏包下载失败（HTTP ${request.status}）`));
            return;
          }
          resolve(request.response);
        });
        request.addEventListener('error', () => reject(new Error('真实录屏包下载连接中断。')));
        request.addEventListener('timeout', () => reject(new Error('真实录屏包下载超时，请重试。')));
        request.send();
      });
    }

    function loadRecordedExample() {
      return runStoreAction('package-source', '载入录屏示例', loadRecordedExampleOnce);
    }

    async function loadRecordedExampleOnce() {
      const eligibleRecordedExample = record => Boolean(
        record
        && (record.artifacts || {}).recording
        && !recordingPrivacy((record.artifacts || {}).recording).quarantined
        && (
          recordKind(record) === 'benchmark'
          || (
            recordKind(record) === 'community'
            && record.reproduction_contract?.publishable_as_verified === true
          )
        )
      );
      const source = (
        eligibleRecordedExample(state.selected) ? state.selected : null
      ) || state.records.find(record => (
        record.workflow_id === 'assistantbench_apple_board' && eligibleRecordedExample(record)
      )) || state.records.find(eligibleRecordedExample);
      if (!source) throw new Error('Store 中还没有带真实录屏的公开示例。');
      openPublisherPanel();
      els.loadRecordedExample.disabled = true;
      try {
        showPublishFeedback(`正在读取 ${source.workflow_title || source.workflow_name} 的真实录屏包…`);
        const blob = await downloadCommunityPackage(source.record_id, value => {
          showPublishFeedback(`正在读取真实录屏包… ${value}%`);
        });
        const safeName = String(source.workflow_name || source.workflow_id || 'recorded-replay')
          .replace(/[^a-zA-Z0-9_.-]+/g, '-');
        const file = new File([blob], `${safeName}.gpa-record.zip`, { type: 'application/zip' });
        await inspectCommunityPackage(file);
      } finally {
        els.loadRecordedExample.disabled = false;
      }
    }

    function publishLocalWorkflow() {
      return runStoreAction('publish-record', '发布本地 Replay', publishLocalWorkflowOnce);
    }

    async function publishLocalWorkflowOnce() {
      const workflowId = els.publishWorkflow.value;
      const options = publishOptions();
      if (!workflowId) throw new Error('请先选择一个本地工作流。');
      if (!publisherDeclarationReady()) throw new Error('请完成四项发布者声明。');
      els.publishLocal.disabled = true;
      els.publishLocal.textContent = '正在发布…';
      showPublishFeedback('正在校验并发布…');
      try {
        const data = await postJson('/api/community/records', { ...options, workflow_id: workflowId }, { timeoutMs: 120000 });
        [els.publishRights, els.publishPrivacy, els.publishSafe, els.publishConsent].forEach(input => { input.checked = false; });
        showPublishFeedback(data.record.duplicate ? '相同内容已经存在，已打开原记录。' : '工作流已发布到 Replay Store。');
        await loadStore({ preserveSelection: false });
        closePublisherPanel();
        await selectRecord(data.record.record_id);
      } finally {
        els.publishLocal.disabled = false;
        els.publishLocal.textContent = '发布到待验证区';
      }
    }

    function uploadCommunityPackage() {
      return runStoreAction('publish-record', '发布 Replay 包', uploadCommunityPackageOnce);
    }

    async function uploadCommunityPackageOnce() {
      const file = state.stagedPackageFile;
      if (!file || !state.stagedPackageInspection) throw new Error('请先选择并检查一个 Replay 包。');
      const options = publishOptions();
      if (!publisherDeclarationReady()) throw new Error('请完成四项发布者声明。');
      els.confirmPackageUpload.disabled = true;
      showPublishFeedback(`正在发布已检查快照 ${file.name}…`);
      const data = await postJson('/api/community/publish-inspection', {
        ...options,
        inspection_token: state.stagedPackageInspection.inspection_token,
        publication_mode: 'verified_replay',
      }, { timeoutMs: 120000 });
      [els.publishRights, els.publishPrivacy, els.publishSafe, els.publishConsent].forEach(input => { input.checked = false; });
      clearStagedPackage();
      showPublishFeedback(data.record.duplicate ? '相同社区包已经存在。' : '社区包已发布。');
      await loadStore({ preserveSelection: false });
      closePublisherPanel();
      await selectRecord(data.record.record_id);
    }

    els.search.addEventListener('input', () => {
      state.query = els.search.value;
      syncCatalogQuery();
      renderCatalog();
    });
    els.searchClear.addEventListener('click', () => {
      state.query = '';
      els.search.value = '';
      syncCatalogQuery();
      renderCatalog();
      els.search.focus();
    });
    els.sort.addEventListener('change', () => {
      state.sort = els.sort.value;
      renderCatalog();
    });
    els.refresh.addEventListener('click', () => loadStore().catch(showStoreLoadError));
    els.openPublisher.addEventListener('click', openPublisherPanel);
    els.closePublisher.addEventListener('click', closePublisherPanel);
    els.publisherPanel.addEventListener('cancel', event => {
      event.preventDefault();
      closePublisherPanel();
    });
    els.publisherPanel.addEventListener('close', () => {
      const target = publisherReturnFocus;
      publisherReturnFocus = null;
      requestAnimationFrame(() => {
        if (target instanceof HTMLElement && target.isConnected) target.focus({ preventScroll: true });
      });
    });
    els.publisherPanel.addEventListener('click', event => {
      if (event.target !== els.publisherPanel) return;
      const rect = els.publisherPanel.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closePublisherPanel();
    });
    els.reportForm.addEventListener('submit', submitReport);
    els.closeReport.addEventListener('click', closeReportDialog);
    els.cancelReport.addEventListener('click', closeReportDialog);
    els.reportDialog.addEventListener('cancel', event => { event.preventDefault(); closeReportDialog(); });
    els.reportDialog.addEventListener('click', event => {
      if (event.target !== els.reportDialog) return;
      const rect = els.reportDialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closeReportDialog();
    });
    els.publishLocal.addEventListener('click', () => publishLocalWorkflow().catch(error => showPublishFeedback(error.message, 'error')));
    els.uploadPackage.addEventListener('click', () => els.packageFile.click());
    els.packageDropzone.addEventListener('click', () => els.packageFile.click());
    els.packageDropzone.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        els.packageFile.click();
      }
    });
    for (const eventName of ['dragenter', 'dragover']) {
      els.packageDropzone.addEventListener(eventName, event => {
        event.preventDefault();
        els.packageDropzone.classList.add('dragging');
      });
    }
    for (const eventName of ['dragleave', 'drop']) {
      els.packageDropzone.addEventListener(eventName, event => {
        event.preventDefault();
        els.packageDropzone.classList.remove('dragging');
      });
    }
    els.packageDropzone.addEventListener('drop', event => {
      const file = event.dataTransfer?.files?.[0];
      inspectCommunityPackage(file).catch(error => {
        clearStagedPackage();
        showPublishFeedback(error.message, 'error');
      });
    });
    els.loadRecordedExample.addEventListener('click', () => loadRecordedExample().catch(error => {
      showPublishFeedback(error.message, 'error');
    }));
    els.confirmPackageUpload.addEventListener('click', () => uploadCommunityPackage().catch(error => {
      updatePackagePublishState();
      showPublishFeedback(error.message, 'error');
    }));
    [els.publishRights, els.publishPrivacy, els.publishSafe, els.publishConsent].forEach(input => input.addEventListener('change', updatePackagePublishState));
    els.detailBackdrop.addEventListener('click', clearRecordSelection);
    els.detail.addEventListener('keydown', trapDetailFocus);
    mobileDetailMedia.addEventListener('change', () => syncDetailPresentation({ focusClose: Boolean(state.selectedId) }));
    document.addEventListener('keydown', event => {
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName || '');
      if (event.key === '/' && !typing) {
        event.preventDefault();
        els.search.focus();
      }
      if (event.key === 'Escape' && state.selectedId) clearRecordSelection();
    });
    els.packageFile.addEventListener('change', () => inspectCommunityPackage(els.packageFile.files?.[0]).catch(error => {
      clearStagedPackage();
      showPublishFeedback(error.message, 'error');
    }));

    Promise.allSettled([loadStore(), loadLocalWorkflows(), loadHeaderStatus(), sendStoreHeartbeat()]).then(results => {
      if (results[0].status === 'rejected') showStoreLoadError(results[0].reason);
      if (results[1].status === 'rejected') showPublishFeedback('本地 Replay 暂时无法读取，稍后重试发布。', 'error');
    });
    GPAClient.createVisibilityPoller(() => loadHeaderStatus().catch(() => {}), {
      activeMs: 1500,
      hiddenMs: 10000,
      runImmediately: false,
    });
    GPAClient.createVisibilityPoller(() => sendStoreHeartbeat().catch(() => {}), {
      activeMs: 5000,
      hiddenMs: 10000,
      runImmediately: false,
    });
    window.addEventListener('pagehide', () => {
      GPAClient.sendJsonBeacon('/api/client/disconnect', { client_id: STORE_CLIENT_ID }, {
        baseUrl: API_BASE,
      });
    });
  </script>
</body>
</html>
