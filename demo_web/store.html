<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPA · Replay Store</title>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #667085;
      --teal: #255f75;
      --teal-dark: #1e5063;
      --teal-soft: #e9f3f6;
      --clay: #a65f1a;
      --clay-soft: #fff8ef;
      --paper: #fff;
      --canvas: #f6f7f9;
      --line: #dfe3e8;
      --line-strong: #c8d0d9;
      --success: #27745a;
      --danger: #a53a2a;
      --shadow: none;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(37, 95, 117, 0.2);
      outline-offset: 3px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    .header-left { display: flex; align-items: center; gap: 24px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; }
    .mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: linear-gradient(135deg, var(--teal) 0 50%, transparent 50%), linear-gradient(135deg, transparent 54%, #d17a44 54%), #e8c14c;
    }
    .brand h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    .sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .topbar { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .chip { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: #fbfcfd; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 99px; margin-right: 7px; background: var(--success); }
    .dot.recording { background: var(--danger); }
    .dot.running { background: var(--clay); }

    .product-nav { display: flex; align-items: center; gap: 4px; }
    .product-nav a {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 0 11px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .product-nav a.active { color: var(--teal-dark); background: var(--teal-soft); }
    .product-nav a:hover { color: var(--ink); }

    .page { width: min(1460px, calc(100% - 32px)); margin: 0 auto; padding: 16px 0 48px; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--clay); }
    h1 { margin: 0; max-width: 680px; font-size: 20px; line-height: 1.2; }
    .primary, .secondary, .ghost {
      min-height: 38px;
      border-radius: 7px;
      padding: 0 14px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 800;
      transition: background .15s ease, border-color .15s ease;
    }
    .primary { color: white; background: var(--teal); }
    .primary:hover { background: var(--teal-dark); }
    .primary:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    .secondary { color: var(--teal-dark); background: var(--teal-soft); border-color: rgba(36, 95, 104, .18); }
    .ghost { color: var(--muted); background: transparent; border-color: var(--line); }

    .catalog-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 12px 0;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }
    .filter.active { color: white; border-color: var(--teal); background: var(--teal); }
    .result-count { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .store-layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; align-items: start; }
    .catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .record-card {
      position: relative;
      display: grid;
      gap: 11px;
      min-height: 220px;
      padding: 14px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: inherit;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .record-card:hover { border-color: var(--line-strong); background: #fbfcfd; }
    .record-card.active { border-color: var(--teal); background: var(--teal-soft); box-shadow: 0 0 0 2px rgba(37, 95, 117, .09); }
    .card-top { display: flex; justify-content: space-between; gap: 14px; }
    .category-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--clay-soft);
      color: var(--clay);
      font-weight: 900;
      text-transform: uppercase;
    }
    .run-pill { align-self: start; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 850; }
    .run-pill.succeeded { background: #e7f4ec; color: var(--success); }
    .run-pill.failed { background: #fae9e7; color: var(--danger); }
    .run-pill.external-blocked { background: #fff0d8; color: #8a5514; }
    .record-card h2 { margin: 0; font-size: 16px; line-height: 1.25; }
    .record-card p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .card-meta { display: flex; justify-content: space-between; gap: 10px; padding-top: 13px; border-top: 1px solid #eceeea; color: var(--muted); font-size: 12px; }

    .detail-panel {
      position: sticky;
      top: 80px;
      max-height: calc(100dvh - 96px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: rgba(37,95,117,.28) transparent;
    }
    .detail-empty { padding: 24px; }
    .detail-empty .category-mark { margin-bottom: 18px; }
    .detail-empty h2 { margin: 0 0 10px; font-size: 22px; }
    .detail-empty p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .detail-body { padding: 18px; }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .detail-head h2 { margin: 0; font-size: 20px; line-height: 1.2; }
    .facts { display: grid; gap: 9px; margin: 20px 0; }
    .fact { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; min-width: 0; font-size: 12px; line-height: 1.45; }
    .fact span:first-child { color: var(--muted); }
    .fact strong { min-width: 0; overflow-wrap: anywhere; }
    .source-link { color: var(--teal-dark); text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
    .tutorial-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 14px 0; }
    .tutorial-actions a { min-height: 42px; display: grid; place-items: center; border-radius: 9px; text-decoration: none; font-size: 13px; font-weight: 800; }
    .tutorial-actions .practice-link { background: var(--teal); color: #fff; }
    .tutorial-actions .official-link { border: 1px solid var(--line); color: var(--teal-dark); background: #fff; }
    .tutorial-boundary { margin: 0 0 14px; border-radius: 9px; padding: 11px 12px; background: var(--teal-soft); color: var(--teal-dark); font-size: 12px; line-height: 1.5; }
    .source-note { margin: 12px 0 0; padding: 10px 12px; border: 1px solid #bed7df; border-radius: 7px; background: var(--teal-soft); color: var(--teal-dark); font-size: 12px; line-height: 1.55; }
    .benchmark-run-panel { margin-top: 14px; padding: 14px; border: 1px solid rgba(14,102,112,.18); border-radius: 13px; background: linear-gradient(145deg, rgba(228,241,241,.82), rgba(255,255,255,.9)); }
    .benchmark-run-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .benchmark-run-head h3 { margin: 0; font-size: 13px; }
    .benchmark-run-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .benchmark-run-actions { display: flex; gap: 8px; margin-top: 12px; }
    .benchmark-run-actions button { flex: 1; min-height: 38px; }
    .benchmark-run-status { min-height: 18px; margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    .benchmark-run-status.success { color: var(--success); }
    .benchmark-run-status.error { color: var(--danger); }
    .benchmark-run-status.running { color: var(--teal-dark); }
    .recording-player { width: 100%; max-height: 280px; margin-top: 14px; border-radius: 8px; background: #101418; }
    .recording-context { margin-top: 14px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #f7faf9; }
    .recording-context-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .recording-context-head strong { font-size: 12px; }
    .recording-context-head span { padding: 4px 7px; border-radius: 999px; background: #dff2e9; color: #17684d; font-size: 9px; font-weight: 800; letter-spacing: .08em; }
    .recording-context.warn .recording-context-head span { background: #fff0d8; color: #8a5310; }
    .recording-context p { margin: 6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .save-area { padding: 14px 18px 18px; border-top: 1px solid var(--line); background: #fbfcfd; }
    .save-area .primary { width: 100%; }
    .safe-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .open-replay {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: var(--teal);
      color: white;
      text-decoration: none;
      font-weight: 850;
    }
    .open-replay:hover { background: var(--teal-dark); }
    .saved-note { margin: 0 0 12px; color: var(--success); font-size: 13px; font-weight: 800; }
    .handoff-ready { margin: 0 0 12px; padding: 11px 12px; border: 1px solid rgba(17,119,102,.16); border-radius: 9px; background: #f3faf7; }
    .handoff-ready strong { display: block; color: var(--teal-dark); font-size: 12px; }
    .handoff-ready span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 310px;
      display: grid;
      place-items: center;
      padding: 38px;
      border: 1px dashed #bdc5c1;
      border-radius: var(--radius);
      background: rgba(255, 253, 249, .62);
      text-align: center;
    }
    .empty-state h2 { margin: 12px 0 8px; font-size: 22px; }
    .empty-state p { max-width: 470px; margin: 0; color: var(--muted); line-height: 1.6; }
    .store-load-error { border-color: rgba(180,72,62,.22); background: linear-gradient(145deg, #fff9f7, #fff 72%); }
    .store-load-error .category-mark { background: #f8e6e2; color: #a64e43; }
    .store-load-error button { min-width: 108px; margin-top: 18px; }
    .store-load-error small {
      display: block; max-width: 360px; margin: 10px auto 0; overflow: hidden;
      color: #a39793; font-size: 10px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap;
    }

    .feedback { margin-top: 12px; padding: 11px 13px; border-radius: 10px; background: var(--teal-soft); color: var(--teal-dark); font-size: 12px; line-height: 1.5; }
    .feedback.error { color: var(--danger); background: #fae9e7; }

    .publisher { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 18px; }
    .publisher summary { width: fit-content; cursor: pointer; color: var(--teal-dark); font-size: 14px; font-weight: 850; }
    .publisher-card { margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .publisher-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .publisher-grid input, .publisher-grid select {
      min-height: 42px;
      width: 100%;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
    }
    .privacy { display: flex; gap: 9px; align-items: flex-start; margin: 14px 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .privacy input { margin-top: 2px; }
    .publisher-declarations { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
    .publisher-declarations .privacy { margin:0; padding:10px; border:1px solid var(--line); border-radius:7px; background:#fbfcfd; }
    .community-link { display:inline-flex; align-items:center; min-height:38px; padding:0 13px; border:1px solid var(--line); border-radius:7px; color:var(--teal-dark); background:#fff; font-size:12px; font-weight:800; text-decoration:none; }
    .trust-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border-radius:999px; background:#edf5f7; color:var(--teal-dark); font-size:10px; font-weight:850; }
    .report-area { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
    .report-area button { width:100%; }
    .report-dialog { width:min(480px,calc(100% - 24px)); padding:0; border:0; border-radius:12px; background:transparent; }
    .report-dialog::backdrop { background:rgba(20,27,32,.52); backdrop-filter:blur(3px); }
    .report-card { padding:18px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .report-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .report-head h2 { margin:3px 0 0; font-size:18px; }.report-head small{color:var(--muted)}
    .report-card select,.report-card textarea { width:100%; margin-top:12px; padding:10px; border:1px solid var(--line); border-radius:7px; background:#fff; }
    .report-card textarea { min-height:105px; resize:vertical; }
    .report-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
    .publisher-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .package-dropzone {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
      padding: 14px;
      border: 1px dashed rgba(14,102,112,.36);
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(228,241,241,.65), rgba(255,255,255,.84));
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .package-dropzone:hover, .package-dropzone.dragging { border-color: var(--teal); background: var(--teal-soft); transform: translateY(-1px); }
    .drop-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #fff; color: var(--teal-dark); font-size: 20px; box-shadow: 0 5px 14px rgba(31,52,58,.08); }
    .package-dropzone strong { display: block; font-size: 12px; }
    .package-dropzone p { margin: 4px 0 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .drop-state { color: var(--teal-dark); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .package-inspection {
      display: none;
      margin: 14px 0;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(239, 250, 247, .8), rgba(255, 253, 249, .92));
    }
    .package-inspection.visible { display: block; }
    .inspection-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .inspection-head h3 { margin: 0 0 5px; font-size: 15px; }
    .inspection-head p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .contract-gate {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      margin-top: 12px;
      padding: 13px;
      border: 1px solid rgba(17,119,102,.18);
      border-radius: 11px;
      background: rgba(255,255,255,.9);
    }
    .contract-gate.incomplete { border-color: rgba(174,57,43,.22); background: rgba(255,247,246,.94); }
    .contract-score {
      --score: 0;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff 56%, transparent 58%), conic-gradient(var(--teal) calc(var(--score) * 1%), #e5ebe8 0);
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
    }
    .contract-copy strong { display: block; font-size: 13px; }
    .contract-copy p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .contract-checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .contract-check { padding: 4px 7px; border-radius: 999px; background: #e7f4ec; color: var(--success); font-size: 10px; font-weight: 800; }
    .contract-check.failed { background: #fae9e7; color: var(--danger); }
    .evidence-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    .evidence-item { padding: 10px; border: 1px solid rgba(17, 119, 102, .12); border-radius: 9px; background: rgba(255,255,255,.84); }
    .evidence-item strong { display: block; font-size: 12px; margin-bottom: 4px; }
    .evidence-item span { color: var(--muted); font-size: 11px; line-height: 1.4; }
    .evidence-item.missing strong { color: var(--danger); }
    .environment-differences { display: grid; gap: 6px; margin-top: 10px; }
    .mini-label { color: var(--teal); font-size: 10px; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; }
    .environment-difference { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.78); color: var(--muted); font-size: 11px; line-height: 1.45; }
    .environment-difference strong { color: var(--ink); }
    .environment-difference.blocking { background: #fae9e7; color: var(--danger); }
    .environment-difference.warn { background: #fff4df; color: #8a5514; }
    .inspection-proof {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr);
      gap: 10px;
      margin-top: 10px;
    }
    .agent-proof, .recording-proof {
      padding: 12px;
      border: 1px solid rgba(17,119,102,.14);
      border-radius: 10px;
      background: rgba(255,255,255,.82);
    }
    .agent-proof h4, .recording-proof h4 { margin: 0 0 6px; font-size: 12px; }
    .agent-proof p, .recording-proof p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .action-proof { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0; }
    .action-proof span { padding: 4px 7px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-size: 10px; font-weight: 750; }
    .criteria-proof { display: grid; gap: 5px; margin-top: 8px; }
    .criteria-proof div { color: var(--muted); font-size: 10px; line-height: 1.4; }
    .inspection-recording { width: 100%; max-height: 230px; margin-top: 9px; border-radius: 8px; background: #101418; }
    .snapshot-proof { margin-top: 9px; color: var(--muted); font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .upload-progress { height: 5px; margin-top: 11px; overflow: hidden; border-radius: 99px; background: rgba(17,119,102,.12); }
    .upload-progress span { display: block; width: 0; height: 100%; background: var(--teal); transition: width .18s ease; }
    .contract-summary { margin: 12px 0 0; padding: 12px; border: 1px solid rgba(17,119,102,.16); border-radius: 10px; background: linear-gradient(135deg,#f6fbfa,#fff); }
    .contract-summary-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .contract-summary-head strong { font-size:12px; }
    .contract-summary-head span { color:var(--teal-dark); font-size:11px; font-weight:900; }
    .contract-summary p { margin:6px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }
    .handoff-link { display:inline-flex; align-items:center; min-height:30px; margin-top:9px; padding:0 10px; border:1px solid rgba(17,119,102,.2); border-radius:7px; color:var(--teal-dark); background:#fff; text-decoration:none; font-size:10px; font-weight:850; }
    .isolated-audit { margin: 10px 0 0; padding: 12px; border: 1px solid rgba(17,119,102,.16); border-radius: 10px; background: linear-gradient(135deg,#f7fbfa,#f4f6f3); }
    .isolated-audit.passed { border-color: rgba(40,130,85,.26); background: linear-gradient(135deg,#eff9f2,#fbfdfb); }
    .isolated-audit.failed { border-color: rgba(174,57,43,.24); background: linear-gradient(135deg,#fff6f4,#fff); }
    .isolated-audit-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .isolated-audit-head strong { display:block; font-size:12px; }

    .isolated-audit.passed .isolated-audit-head span { background:#e1f3e7; color:var(--success); }
    .isolated-audit.failed .isolated-audit-head span { background:#fae9e7; color:var(--danger); }

    @media (max-width: 1080px) {
      .store-layout { grid-template-columns: 1fr; }

      .publisher-grid { grid-template-columns: repeat(2, 1fr); }

    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 1460px); padding-top: 34px; }

      .catalog-toolbar { align-items: flex-start; flex-direction: column; }
      .publisher-grid { grid-template-columns: 1fr; }

    @media (max-width: 680px) {
      header { height: auto; align-items: flex-start; flex-direction: column; padding: 14px; }

      .product-nav a { flex: 1; justify-content: center; }

    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>

        <textarea id="reportDetails" maxlength="1200" placeholder="补充可帮助审核的信息（不要填写自己的敏感信息）" aria-label="举报说明"></textarea>

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.addEventListener('pageshow', () => window.scrollTo(0, 0), { once: true });
    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8765' : '';
    const STORE_CLIENT_ID = (() => {
      try {
        const key = 'gpa_console_client_id';
        const existing = localStorage.getItem(key);
        if (existing) return existing;
        const id = globalThis.crypto?.randomUUID?.() || `client_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        localStorage.setItem(key, id);
        return id;
      } catch {
        return `client_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      }
    })();
    const state = {
      records: [], selectedId: null, selected: null, query: '', collection: 'public', sort: 'recommended', selectionVersion: 0,
      stagedPackageFile: null, stagedPackageInspection: null,
      runtimeStatus: null, refreshedRunIds: new Set(), heartbeatInFlight: false,
      detailReturnScrollY: 0, detailReturnRecordId: '',
      catalogRequestVersion: 0, headerStatusRequestVersion: 0, headerStatusInFlight: false,
      packageInspectionVersion: 0, packageInspectionRequest: null,
    };
    const storeActionPromises = new Map();

    function runStoreAction(scope, label, action) {
      const current = storeActionPromises.get(scope);
      if (current) {
        if (current.label === label) return current.promise;
        return Promise.reject(new Error(`${current.label}尚未完成，请稍候。`));
      }
      const promise = Promise.resolve().then(action).finally(() => {
        if (storeActionPromises.get(scope)?.promise === promise) storeActionPromises.delete(scope);
      });
      storeActionPromises.set(scope, { label, promise });
      return promise;
    }
    const STORE_DEEP_LINK = new URLSearchParams(window.location.search);
    if (['public', 'tutorial', 'official', 'community', 'pending', 'lab'].includes(STORE_DEEP_LINK.get('collection'))) {
      state.collection = STORE_DEEP_LINK.get('collection');
    }
    const REQUESTED_RECORD_ID = STORE_DEEP_LINK.get('record_id') || '';
    const REQUESTED_WORKFLOW_ID = STORE_DEEP_LINK.get('workflow_id') || '';
    let storeDeepLinkApplied = false;
    const els = {
      search: document.getElementById('storeSearch'),
      searchClear: document.getElementById('storeSearchClear'),
      refresh: document.getElementById('refreshStore'),
      filters: document.getElementById('categoryFilters'),
      sort: document.getElementById('storeSort'),
      count: document.getElementById('resultCount'),
      grid: document.getElementById('catalogGrid'),
      detail: document.getElementById('recordDetail'),
      detailBackdrop: document.getElementById('storeDetailBackdrop'),
      publishWorkflow: document.getElementById('publishWorkflow'),
      publishAuthor: document.getElementById('publishAuthor'),
      publishTags: document.getElementById('publishTags'),
      publishLicense: document.getElementById('publishLicense'),
      publishRights: document.getElementById('publishRights'),
      publishPrivacy: document.getElementById('publishPrivacy'),
      publishSafe: document.getElementById('publishSafe'),
      publishConsent: document.getElementById('publishConsent'),
      publishLocal: document.getElementById('publishLocal'),
      uploadPackage: document.getElementById('uploadPackage'),
      loadRecordedExample: document.getElementById('loadRecordedExample'),
      confirmPackageUpload: document.getElementById('confirmPackageUpload'),
      packageFile: document.getElementById('packageFile'),
      packageDropzone: document.getElementById('packageDropzone'),
      dropzoneState: document.getElementById('dropzoneState'),
      packageInspection: document.getElementById('packageInspection'),
      publishFeedback: document.getElementById('publishFeedback'),
      publisherPanel: document.getElementById('publisherPanel'),
      closePublisher: document.getElementById('closePublisher'),
      openPublisher: document.getElementById('openPublisher'),
      reportDialog: document.getElementById('reportDialog'),
      reportForm: document.getElementById('reportForm'),
      reportCategory: document.getElementById('reportCategory'),
      reportDetails: document.getElementById('reportDetails'),
      reportFeedback: document.getElementById('reportFeedback'),
      closeReport: document.getElementById('closeReport'),
      cancelReport: document.getElementById('cancelReport'),
      workspaceStatus: document.getElementById('storeWorkspaceStatus'),
      workspaceStatusTitle: document.getElementById('storeWorkspaceStatusTitle'),
      workspaceStatusMeta: document.getElementById('storeWorkspaceStatusMeta'),
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[char]));
    }

    function safeHttpUrl(value) {
      try {
        const url = new URL(String(value || ''));
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch (_) {
        return '';
      }
    }

    function safeTutorialPracticeUrl(value) {
      try {
        const url = new URL(String(value || ''), window.location.origin);
        const allowedCases = new Set(['gmail-filter', 'sheets-filter-view', 'excel-dropdown', 'macos-shortcut']);
        if (url.origin !== window.location.origin || url.pathname !== '/tutorial-lab') return '';
        if (!allowedCases.has(url.searchParams.get('case'))) return '';
        return `${url.pathname}?case=${encodeURIComponent(url.searchParams.get('case'))}`;
      } catch (_) {
        return '';
      }
    }

    function recordKind(record) {
      const tags = record.tags || [];
      if (tags.includes('benchmark-task')) return 'benchmark';
      if (tags.includes('tutorial')) return 'tutorial';
      if (tags.includes('internal-regression')) return 'internal';
      if (tags.includes('case')) return 'case';
      if (tags.includes('demo')) return 'demo';
      return 'community';
    }

    function recordingScope(recording = {}) {
      const value = String(recording.capture_scope || '').toLowerCase();
      const labels = {
        'browser-tab': '仅浏览器标签页',
        'browser': '仅浏览器标签页',
        'window': '单一应用窗口',
        'application-window': '单一应用窗口',
        'public-web-evidence': '公开来源证据视频',
        'monitor': '整个显示器',
        'screen': '整个显示器',
      };
      return { value: value || 'unknown', label: labels[value] || '捕获范围未记录' };
    }

    function recordingPrivacy(recording = {}) {
      const review = recording.privacy_review || {};
      const passed = review.status === 'passed' && review.other_apps_visible === false;
      const quarantined = review.status === 'failed' || review.quarantined === true;
      return {
        passed,
        quarantined,
        label: quarantined ? '隐私检查失败 · 已隔离' : passed ? '隐私范围抽样通过' : '隐私范围待人工复核',
      };
    }

    function recordingMethod(recording = {}) {
      const value = String(recording.capture_method || '');
      if (value === 'browser-tab-frame-capture') return '浏览器标签页定频帧捕获';
      if (value === 'media-recorder') return '浏览器 MediaRecorder';
      if (value === 'safe-web-source-evidence-render') return 'Safe Web 真实来源证据渲染';
      return value || '旧版录制方式未记录';
    }

    function contractBlockerLabel(blocker) {
      const labels = {
        workflow_structure: '工作流结构不完整',
        recording_evidence: '真实运行视频或解码校验未通过',
        source_trace_evidence: '公开来源机读证据链未通过',
        recording_privacy: '安全捕获范围或隐私复核未通过',
        recorded_environment: '原始系统与录屏捕获环境不完整',
        agent_understanding: 'Agent 任务理解不完整',
        success_criteria: '可验证成功条件不足',
        environment_adaptation: '目标环境适配计划不足',
      };
      return labels[blocker] || blocker;
    }

    function contractBlockers(contract = {}) {
      return (contract.blockers || []).map(contractBlockerLabel).join('、') || '必要证据';
    }

    function isDevelopmentRecord(record) {
      return ['internal', 'case', 'demo'].includes(recordKind(record));
    }

    function matchesCollection(record, collection) {
      const kind = recordKind(record);
      const verified = record.reproduction_contract?.publishable_as_verified === true;
      if (collection === 'tutorial') return kind === 'tutorial';
      if (collection === 'official') return kind === 'benchmark';
      if (collection === 'community') return kind === 'community' && verified;
      if (collection === 'pending') return kind === 'community' && !verified;
      if (collection === 'lab') return isDevelopmentRecord(record);
      return kind === 'tutorial' || kind === 'benchmark' || (kind === 'community' && verified);
    }

    async function getJson(path, options = {}) {
      return GPAClient.requestJson(path, { ...options, baseUrl: API_BASE });
    }

    function postJson(path, payload = {}, options = {}) {
      return GPAClient.postJson(path, payload, { ...options, baseUrl: API_BASE });
    }

    function setStoreLoading(active) {
      els.grid.classList.toggle('is-loading', active);
      els.grid.setAttribute('aria-busy', active ? 'true' : 'false');
      els.refresh.disabled = active;
      els.refresh.textContent = active ? '刷新中' : '刷新';
      if (active && !state.records.length) els.count.textContent = '正在同步 Replay…';
    }

    function syncCatalogQuery() {
      const hasQuery = Boolean(state.query.trim());
      els.searchClear.hidden = !hasQuery;
      els.search.closest('.catalog-query')?.classList.toggle('has-query', hasQuery);
    }

    function paintStoreWorkspaceStatus(kind, title, meta) {
      els.workspaceStatus.dataset.state = kind;
      els.workspaceStatusTitle.textContent = title;
      els.workspaceStatusMeta.textContent = meta;
    }

    async function loadHeaderStatus() {
      if (state.headerStatusInFlight) return false;
      state.headerStatusInFlight = true;
      const requestVersion = ++state.headerStatusRequestVersion;
      try {
        const data = await getJson('/api/status', { timeoutMs: 8000 });
        if (requestVersion !== state.headerStatusRequestVersion) return false;
        state.runtimeStatus = data;
        const recording = data.recording || {};
        const run = data.run || {};
        if (recording.active) {
          paintStoreWorkspaceStatus('recording', '正在录制 Replay', '返回工作台可查看录制进度');
        } else if (run.active) {
          paintStoreWorkspaceStatus('running', 'Replay 正在运行', run.workflow_id ? `任务 · ${run.workflow_id}` : '完成后将自动刷新结果');
        } else {
          paintStoreWorkspaceStatus('ready', 'Store 已连接', '可浏览、验证或保存 Replay');
        }
        updateBenchmarkRunControls();
        const selectedWorkflowId = state.selected?.saved_workflow_id || state.selected?.workflow_id || '';
        if (!run.active && run.run_id && run.workflow_id === selectedWorkflowId && !state.refreshedRunIds.has(run.run_id)) {
          state.refreshedRunIds.add(run.run_id);
          loadStore().catch(() => {});
        }
        return true;
      } catch (error) {
        if (requestVersion !== state.headerStatusRequestVersion) return false;
        state.runtimeStatus = { unavailable: true };
        paintStoreWorkspaceStatus('limited', 'Store 暂时离线', '正在重新连接，不影响本页已加载内容');
        updateBenchmarkRunControls();
        return false;
      } finally {
        if (requestVersion === state.headerStatusRequestVersion) state.headerStatusInFlight = false;
      }
    }

    async function sendStoreHeartbeat() {
      if (state.heartbeatInFlight) return;
      state.heartbeatInFlight = true;
      try {
        await postJson('/api/client/heartbeat', {
          client_id: STORE_CLIENT_ID,
          environment: clientEnvironmentSnapshot(),
        }, { timeoutMs: 8000 });
      } finally {
        state.heartbeatInFlight = false;
      }
    }

    function initials(record) {
      const source = (record.tags || [])[0] || record.workflow_title || record.workflow_name || 'GPA';
      return String(source).slice(0, 3).toUpperCase();
    }

    function showPublishFeedback(message, kind = '') {
      els.publishFeedback.innerHTML = message
        ? `<div class="feedback state-message ${kind === 'error' ? 'is-error' : kind === 'warn' ? 'is-warning' : 'is-success'}">${escapeHtml(message)}</div>`
        : '';
    }

    function publishOptions() {
      return {
        author: els.publishAuthor.value.trim() || 'Anonymous',
        tags: els.publishTags.value.split(',').map(tag => tag.trim()).filter(Boolean),
        record_license: els.publishLicense.value,
        privacy_reviewed: els.publishPrivacy.checked,
        publisher_declaration: {
          owns_rights: els.publishRights.checked,
          no_secrets: els.publishPrivacy.checked,
          safe_content: els.publishSafe.checked,
          public_consent: els.publishConsent.checked,
        },
        client_environment: clientEnvironmentSnapshot(),
      };
    }

    function publisherDeclarationReady() {
      return els.publishRights.checked && els.publishPrivacy.checked && els.publishSafe.checked && els.publishConsent.checked;
    }

    let publisherReturnFocus = null;
    function openPublisherPanel() {
      publisherReturnFocus = document.activeElement;
      if (!els.publisherPanel.open) els.publisherPanel.showModal();
      requestAnimationFrame(() => (els.publishWorkflow || els.closePublisher)?.focus({ preventScroll: true }));
    }
    function closePublisherPanel() {
      if (els.publisherPanel.open) els.publisherPanel.close();
    }

    async function loadStore({ preserveSelection = true } = {}) {
      const requestVersion = ++state.catalogRequestVersion;
      const isLatestRequest = () => requestVersion === state.catalogRequestVersion;
      setStoreLoading(true);
      try {
        const data = await getJson(`/api/community/records?${clientEnvironmentQuery()}`, { timeoutMs: 30000 });
        if (!isLatestRequest()) return false;
        state.records = data.records || [];
        renderFilters();
        renderCatalog();
        if (!storeDeepLinkApplied) {
          storeDeepLinkApplied = true;
          const requested = state.records.find(record => (
            (REQUESTED_RECORD_ID && record.record_id === REQUESTED_RECORD_ID)
            || (REQUESTED_WORKFLOW_ID && record.workflow_id === REQUESTED_WORKFLOW_ID)
          ));
          if (requested) {
            await selectRecord(requested.record_id, { preserveCatalog: true });
            return true;
          }
        }
        if (preserveSelection && state.selectedId && state.records.some(record => record.record_id === state.selectedId)) {
          await selectRecord(state.selectedId, { preserveCatalog: true });
        }
        return true;
      } catch (error) {
        if (!isLatestRequest()) return false;
        throw error;
      } finally {
        if (isLatestRequest()) setStoreLoading(false);
      }
    }

    function showStoreLoadError(error) {
      const message = error?.message || error || '目录同步失败';
      const retained = state.records.length ? ` · 已保留 ${state.records.length} 个结果` : '';
      els.count.textContent = `刷新失败${retained}`;
      els.count.title = String(message);
      els.count.setAttribute('aria-label', `Replay Store 刷新失败：${message}${retained}`);
      if (state.records.length) return;
      els.grid.classList.remove('is-loading');
      els.grid.setAttribute('aria-busy', 'false');
      els.grid.innerHTML = `
        <div class="empty-state store-load-error state-surface is-error" role="alert">
          <span class="state-surface-mark" aria-hidden="true">!</span>
          <h2>暂时无法载入 Replay Store</h2>
          <p>当前目录尚未载入。重新连接不会影响本地保存的 Replay。</p>
          <button type="button" data-retry-store>重新连接</button>
          <small title="${escapeHtml(message)}">${escapeHtml(message)}</small>
        </div>
      `;
      els.grid.querySelector('[data-retry-store]')?.addEventListener('click', event => {
        event.currentTarget.disabled = true;
        event.currentTarget.textContent = '正在连接…';
        loadStore().catch(showStoreLoadError);
      });
    }

    async function loadLocalWorkflows() {
      const data = await getJson('/api/workflows', { timeoutMs: 20000 });
      const workflows = data.workflows || [];
      els.publishWorkflow.innerHTML = '<option value="">选择本地工作流</option>' + workflows.map(workflow => (
        `<option value="${escapeHtml(workflow.id)}">${escapeHtml(workflow.title || workflow.name)} · ${escapeHtml(workflow.id)}</option>`
      )).join('');
      const publishId = new URLSearchParams(window.location.search).get('publish');
      if (publishId && workflows.some(workflow => workflow.id === publishId)) {
        els.publishWorkflow.value = publishId;
        openPublisherPanel();
      } else if (new URLSearchParams(window.location.search).get('open') === 'publish') {
        openPublisherPanel();
      }
    }

    function filteredRecords() {
      const query = state.query.trim().toLowerCase();
      const order = { tutorial: 0, benchmark: 1, community: 2, internal: 3, case: 4, demo: 5 };
      const records = state.records.filter(record => {
        const haystack = [
          record.workflow_title, record.workflow_name, record.description,
          record.task_description, record.author, JSON.stringify(record.provenance || {}),
          ...(record.tags || []),
        ].join(' ').toLowerCase();
        return matchesCollection(record, state.collection) && (!query || haystack.includes(query));
      });
      const dateValue = record => Date.parse(record.updated_at || record.published_at || '') || 0;
      const importCount = record => Number(record.stats?.imports || 0);
      const score = record => Number(record.reproduction_contract?.score || 0);
      const sorters = {
        recent: (a, b) => dateValue(b) - dateValue(a),
        popular: (a, b) => importCount(b) - importCount(a) || score(b) - score(a),
        shortest: (a, b) => Number(a.step_count || 0) - Number(b.step_count || 0),
        recommended: (a, b) => order[recordKind(a)] - order[recordKind(b)] || score(b) - score(a) || importCount(b) - importCount(a),
      };
      return records.sort(sorters[state.sort] || sorters.recommended);
    }

    function renderFilters() {
      const definitions = [
        { value: 'public', label: '全部' },
        { value: 'tutorial', label: '实战教程' },
        { value: 'official', label: '官方基准' },
        { value: 'community', label: '社区实录' },
        { value: 'pending', label: '待验证上传' },
        { value: 'lab', label: '可隔离演练' },
      ];
      const items = definitions.map(item => ({
        ...item,
        count: state.records.filter(record => matchesCollection(record, item.value)).length,
      })).filter(item => item.value === 'public' || item.count > 0);
      if (!items.some(item => item.value === state.collection)) state.collection = 'public';
      els.filters.innerHTML = items.map(item => (
        `<button class="filter ${state.collection === item.value ? 'active' : ''}" data-collection="${escapeHtml(item.value)}" aria-pressed="${state.collection === item.value ? 'true' : 'false'}"><span>${escapeHtml(item.label)}</span><span class="filter-count">${escapeHtml(item.count)}</span></button>`
      )).join('');
      els.filters.querySelectorAll('[data-collection]').forEach(button => {
        button.addEventListener('click', () => {
          state.collection = button.dataset.collection || 'public';
          renderFilters();
          renderCatalog();
        });
      });
    }

    function catalogSupportingText(record) {
      return record.task_description || record.description || '查看任务目标、适用条件和运行边界。';
    }

    function catalogKindLabel(record) {
      return {
        tutorial: '实战教程', benchmark: '官方基准', community: '社区实录', internal: '内部回归',
        case: '合成案例', demo: '示例 Replay',
      }[recordKind(record)] || 'Replay';
    }

    function catalogDecision(record) {
      const contract = record.reproduction_contract || {};
      const environmentDiff = record.environment_diff || {};
      const safeWeb = record.safe_web || {};
      const recording = (record.artifacts || {}).recording || {};
      const privacy = recordingPrivacy(recording);
      const adaptationCount = (environmentDiff.adaptation_plan || []).length;
      if (recordKind(record) === 'tutorial') return { kind: 'ready', mark: '✓', title: '可在隔离环境演练' };
      if (privacy.quarantined) return { kind: 'blocked', mark: '!', title: '隐私证据已隔离' };
      if (!contract.publishable_as_verified) return { kind: 'review', mark: '·', title: '需要人工复核' };
      if (safeWeb.runnable) return { kind: 'ready', mark: '✓', title: '可以安全验证' };
      if (environmentDiff.status === 'unknown') return { kind: 'review', mark: '·', title: '需要补充环境证据' };
      if (environmentDiff.status === 'blocked') return { kind: 'blocked', mark: '!', title: '当前环境不适合' };
      if (adaptationCount) return { kind: 'adapt', mark: '↺', title: `需要 ${adaptationCount} 项适配` };
      return { kind: 'review', mark: '·', title: '进入工作台审核' };
    }

    function catalogPermission(record) {
      if (recordKind(record) === 'tutorial') return '仅模拟数据';
      if (record.safe_web?.runnable) return '只读网页';
      const applications = record.understanding?.required_environment?.applications || [];
      return applications.length ? `${applications.length} 个应用` : '运行前确认';
    }

    function catalogEnvironment(record) {
      if (recordKind(record) === 'tutorial') return '浏览器隔离实验室';
      const diff = record.environment_diff || {};
      const adaptations = (diff.adaptation_plan || []).length;
      if (diff.status === 'unknown') return '证据不足';
      if (diff.status === 'blocked') return '存在阻断';
      if (adaptations) return `${adaptations} 项适配`;
      if (diff.status === 'compatible') return '当前兼容';
      return '运行前检查';
    }

    function renderCatalog() {
      const records = filteredRecords();
      if (state.selectedId && !records.some(record => record.record_id === state.selectedId)) {
        state.selectionVersion += 1;
        state.selectedId = null;
        state.selected = null;
        els.detail.innerHTML = '';
        syncDetailPresentation();
      }
      const recorded = records.filter(record => {
        const recording = (record.artifacts || {}).recording || {};
        return record.recording_verification?.verified === true
          && recordingPrivacy(recording).passed;
      }).length;
      const isolated = records.filter(record => {
        const audit = record.isolated_reproduction_audit || {};
        return audit.status === 'passed' && audit.cross_agent_reproducible === true;
      }).length;
      const resultLabel = `${records.length} 个结果`;
      els.count.innerHTML = `<strong>${escapeHtml(records.length)}</strong><span>个结果</span>`;
      els.count.title = `${resultLabel} · ${recorded} 个安全实录 · ${isolated} 个隔离复现`;
      els.count.setAttribute('aria-label', els.count.title);
      els.grid.innerHTML = records.map(record => {
        const feedbackCount = Number(record.stats?.feedback_count || 0);
        const rate = feedbackCount ? `${Math.round(Number(record.stats?.success_rate || 0) * 100)}%` : '暂无反馈';
        const qualityTier = record.stats?.quality?.tier || (feedbackCount ? 'early' : 'untested');
        const qualityLabels = {proven:'多环境验证',tested:'已有测试样本',early:'早期样本',untested:'等待首测'};
        const reproduction = record.reproduction || {};
        const contract = record.reproduction_contract || {};
        const decision = catalogDecision(record);
        const proofLabel = recordKind(record) === 'tutorial'
          ? '官方来源已锁定'
          : feedbackCount
          ? `${rate} · ${qualityLabels[qualityTier] || '早期样本'}`
          : contract.publishable_as_verified
            ? `复现评分 ${contract.score || 0}`
            : reproduction.label || '待验证';
        return `
          <button class="record-card ${state.selectedId === record.record_id ? 'active' : ''}" data-record-id="${escapeHtml(record.record_id)}" aria-controls="recordDetail" aria-expanded="${state.selectedId === record.record_id ? 'true' : 'false'}">
            <div class="card-top">
              <span class="card-kind"><span class="category-mark">${escapeHtml(initials(record))}</span><strong>${escapeHtml(catalogKindLabel(record))}</strong></span>
              <span class="card-save-state">${record.saved_workflow_id ? '已保存' : '可导入'}</span>
            </div>
            <div class="card-copy">
              <h2>${escapeHtml(record.workflow_title || record.workflow_name)}</h2>
              <p>${escapeHtml(catalogSupportingText(record))}</p>
            </div>
            <div class="card-decision is-${escapeHtml(decision.kind)}"><i aria-hidden="true">${escapeHtml(decision.mark)}</i><span><small>适配结论</small><strong>${escapeHtml(decision.title)}</strong></span></div>
            <div class="card-decision-facts">
              <span><small>权限</small><strong>${escapeHtml(catalogPermission(record))}</strong></span>
              <span><small>环境</small><strong>${escapeHtml(catalogEnvironment(record))}</strong></span>
              <span><small>证据</small><strong>${escapeHtml(proofLabel)}</strong></span>
            </div>
            <div class="card-meta">
              <span>${escapeHtml(record.author || catalogKindLabel(record))} · ${escapeHtml(record.step_count || 0)} 步</span>
              <strong>查看详情 <span aria-hidden="true">→</span></strong>
            </div>
          </button>
        `;
      }).join('') || `
        <div class="empty-state state-surface is-empty">
          <div>
            <div class="category-mark" style="margin:auto">0</div>
            <h2>还没有匹配的工作流</h2>
            <p>${state.records.length ? '换一个关键词或分类试试。' : 'Replay Store 目前为空。你可以在页面底部分享第一个本地工作流。'}</p>
            <button class="secondary empty-action" data-empty-action="${state.records.length ? 'reset' : 'import'}">${state.records.length ? '清除筛选' : '添加 Replay'}</button>
          </div>
        </div>
      `;
      els.grid.querySelectorAll('[data-record-id]').forEach(card => {
        card.addEventListener('click', () => {
          if (state.selectedId === card.dataset.recordId) {
            clearRecordSelection();
            return;
          }
          selectRecord(card.dataset.recordId).catch(error => renderDetailError(error.message));
        });
      });
      els.grid.querySelector('[data-empty-action]')?.addEventListener('click', event => {
        if (event.currentTarget.dataset.emptyAction === 'import') {
          openPublisherPanel();
          return;
        }
        state.query = '';
        state.collection = 'public';
        els.search.value = '';
        syncCatalogQuery();
        renderFilters();
        renderCatalog();
        els.search.focus();
      });
    }

    const mobileDetailMedia = window.matchMedia('(max-width: 960px)');

    function syncDetailPresentation({ focusClose = false } = {}) {
      const modal = Boolean(state.selectedId);
      document.body.classList.toggle('store-detail-open', modal);
      els.detailBackdrop.hidden = !modal;
      els.detail.hidden = !modal;
      const inertTargets = [
        document.querySelector('header'),
        els.grid,
        ...document.querySelectorAll('main.page > :not(.store-layout)'),
      ].filter(Boolean);
      inertTargets.forEach(target => {
        target.inert = modal;
        if (modal) target.setAttribute('aria-hidden', 'true');
        else target.removeAttribute('aria-hidden');
      });
      els.detail.setAttribute('role', modal ? 'dialog' : 'region');
      if (modal) els.detail.setAttribute('aria-modal', 'true');
      else els.detail.removeAttribute('aria-modal');
      if (modal) {
        const focusTarget = focusClose ? els.detail.querySelector('[data-close-detail]') : els.detail;
        focusTarget?.focus({ preventScroll: true });
      }
    }

    function trapDetailFocus(event) {
      if (event.key !== 'Tab' || !state.selectedId) return;
      const focusable = [...els.detail.querySelectorAll(
        'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )].filter(item => !item.hidden && item.getClientRects().length);
      if (!focusable.length) {
        event.preventDefault();
        els.detail.focus({ preventScroll: true });
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function clearRecordSelection() {
      const returnRecordId = state.detailReturnRecordId || state.selectedId;
      const returnScrollY = state.detailReturnScrollY;
      state.selectionVersion += 1;
      state.selectedId = null;
      state.selected = null;
      els.detail.innerHTML = '';
      syncDetailPresentation();
      renderCatalog();
      requestAnimationFrame(() => {
        window.scrollTo({ top: returnScrollY, behavior: 'auto' });
        document.querySelector(`[data-record-id="${CSS.escape(returnRecordId || '')}"]`)?.focus({ preventScroll: true });
      });
    }

    function bindDetailClose() {
      document.querySelector('[data-close-detail]')?.addEventListener('click', clearRecordSelection);
    }

    async function selectRecord(recordId, { preserveCatalog = false } = {}) {
      const requestVersion = ++state.selectionVersion;
      if (!state.selectedId) {
        state.detailReturnScrollY = window.scrollY;
        state.detailReturnRecordId = recordId;
      }
      state.selectedId = recordId;
      state.selected = null;
      if (!preserveCatalog) renderCatalog();
      els.detail.innerHTML = '<div class="detail-empty state-surface is-loading" role="status"><div class="category-mark state-surface-mark">···</div><h2>正在读取 Replay</h2><p>正在校验任务、环境和保存状态。</p></div>';
      els.detail.scrollTop = 0;
      syncDetailPresentation();
      let data;
      try {
        data = await getJson(`/api/community/records/${encodeURIComponent(recordId)}?${clientEnvironmentQuery()}`, { timeoutMs: 20000 });
      } catch (error) {
        if (requestVersion !== state.selectionVersion || state.selectedId !== recordId) return;
        throw error;
      }
      if (requestVersion !== state.selectionVersion || state.selectedId !== recordId) return;
      state.selected = data.record;
      renderDetail();
      renderCatalog();
      syncDetailPresentation({ focusClose: true });
    }

    function renderDetailError(message) {
      const recordId=state.selectedId;
      els.detail.innerHTML = `<div class="detail-empty state-surface is-error" role="alert"><div class="category-mark state-surface-mark">!</div><h2>无法打开 Replay</h2><p>详情暂时没有载入。可以重试，不会影响目录和已保存内容。</p><div class="state-surface-actions"><button type="button" data-retry-detail>重试</button><button class="secondary detail-close" type="button" data-close-detail>返回目录</button></div><small title="${escapeHtml(message)}">${escapeHtml(message)}</small></div>`;
      els.detail.querySelector('[data-retry-detail]')?.addEventListener('click',event=>{event.currentTarget.disabled=true;event.currentTarget.textContent='正在重试…';selectRecord(recordId,{preserveCatalog:true}).catch(error=>renderDetailError(error.message));});
      bindDetailClose();
      syncDetailPresentation({ focusClose: true });
    }

    function renderDetail() {
      const record = state.selected;
      if (!record) return;
      const stats = record.stats || {};
      const feedbackCount = Number(stats.feedback_count || 0);
      const rate = feedbackCount ? `${Math.round(Number(stats.success_rate || 0) * 100)}%` : '—';
      const quality = stats.quality || {};
      const qualityLabels = {proven:'多环境验证',tested:'已有测试样本',early:'早期样本',untested:'等待首测'};
      const platform = record.platform || {};
      const provenance = record.provenance || {};
      const kind = recordKind(record);
      const tutorialSource = provenance.tutorial_source || {};
      const tutorialSourceUrl = safeHttpUrl(tutorialSource.url);
      const tutorialPracticeUrl = safeTutorialPracticeUrl((provenance.practice || {}).url);
      const tutorialPanel = kind === 'tutorial' && tutorialPracticeUrl ? `
        <div class="tutorial-boundary">官方教程用于锁定真实任务流程；下方演练只操作本地模拟数据，不会登录或修改真实账号。</div>
        <div class="tutorial-actions">
          <a class="practice-link" href="${escapeHtml(tutorialPracticeUrl)}">开始隔离演练</a>
          ${tutorialSourceUrl ? `<a class="official-link" href="${escapeHtml(tutorialSourceUrl)}" target="_blank" rel="noopener">查看官方教程 ↗</a>` : ''}
        </div>` : '';
      const reproduction = record.reproduction || {};
      const savedId = record.saved_workflow_id || '';
      const datasetUrl = safeHttpUrl(provenance.dataset_url);
      const paperUrl = safeHttpUrl(provenance.paper_url);
      const evaluator = provenance.evaluator || {};
      const renderSourceLinks = (values, prefix) => (values || []).map((value, index) => {
        const href = safeHttpUrl(value);
        if (!href) return '';
        let host = '';
        try { host = new URL(href).hostname; } catch (_) { host = `source-${index + 1}`; }
        return `<a class="source-link" href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(prefix)} ${index + 1} · ${escapeHtml(host)}</a>`;
      }).filter(Boolean).join('<br>');
      const goldSourceLinks = renderSourceLinks(provenance.gold_urls, 'Gold');
      const reproductionSourceLinks = renderSourceLinks(provenance.reproduction_urls, 'Replay');
      const environment = record.environment || {};
      const environmentDiff = record.environment_diff || {};
      const understanding = record.understanding || {};
      const interaction = understanding.interaction_profile || {};
      const recordingAnalysis = provenance.recording_analysis || {};
      const recording = (record.artifacts || {}).recording;
      const sourceTrace = (record.artifacts || {}).source_trace || {};
      const contract = record.reproduction_contract || {};
      const currentResult = kind === 'tutorial'
        ? '可演练'
        : feedbackCount
        ? rate
        : ['succeeded', 'passed', 'success'].includes(reproduction.status)
          ? '已通过'
          : reproduction.label || '未运行';
      const contractScore = contract.schema ? Number(contract.score || 0) : null;
      const isolatedAudit = record.isolated_reproduction_audit || {};
      const recordingMediaVerified = record.recording_media_verified === true
        || isolatedAudit.recording_media_verified === true;
      const capture = recordingScope(recording || {});
      const recordingPrivacyState = recordingPrivacy(recording || {});
      const captureMethod = recordingMethod(recording || {});
      const safeWeb = record.safe_web || {};
      const requiredEnvironment = understanding.required_environment || {};
      const environmentDifferences = (environmentDiff.differences || []).slice(0, 4).map(item => {
        const scale = item.scale_hint ? ` · scale ${item.scale_hint.x}×${item.scale_hint.y}` : '';
        return `<div><strong>${escapeHtml(item.severity || 'info')}</strong> · ${escapeHtml(item.field)}：${escapeHtml(item.recorded)} → ${escapeHtml(item.current)}${escapeHtml(scale)}</div>`;
      }).join('');
      const environmentAdaptations = (environmentDiff.adaptation_plan || []).slice(0, 4).map(item => (
        `<div><strong>${escapeHtml(item.strategy || '适配')}</strong> · ${escapeHtml(item.action || '')}</div>`
      )).join('');
      const sourceEventCount = Number(recordingAnalysis.source_event_count || 0);
      const reducedEventCount = Number(recordingAnalysis.step_reduction_count || 0);
      const agentUnderstandingText = sourceEventCount
        ? `${sourceEventCount} 个原始动作 → ${Number(recordingAnalysis.retained_step_count || record.step_count || 0)} 个步骤${reducedEventCount ? ` · 收束 ${reducedEventCount} 个` : ''}`
        : `${interaction.step_count ?? record.step_count ?? 0} 步 · ${(understanding.success_criteria || []).length} 个成功条件`;
      const benchmarkFacts = kind === 'benchmark' ? `
        <div class="fact"><span>基准</span><strong>${escapeHtml([provenance.benchmark, provenance.benchmark_version, provenance.split].filter(Boolean).join(' · '))}</strong></div>
        <div class="fact"><span>任务 ID</span><strong>${escapeHtml(provenance.task_id || '未提供')}</strong></div>
        <div class="fact"><span>原始题目</span><strong>${escapeHtml(provenance.original_task || record.task_description || '未提供')}</strong></div>
        <div class="fact"><span>官方答案</span><strong>${escapeHtml(provenance.gold_answer || '隐藏或未提供')}</strong></div>
        <div class="fact"><span>评测方式</span><strong>${escapeHtml(evaluator.type || '未提供')}</strong></div>
        <div class="fact"><span>官方数据集</span><strong>${datasetUrl ? `<a class="source-link" href="${escapeHtml(datasetUrl)}" target="_blank" rel="noopener">打开固定版本 dev JSONL</a>` : '未提供'}</strong></div>
        <div class="fact"><span>来源修订</span><strong>${escapeHtml(provenance.dataset_revision ? provenance.dataset_revision.slice(0, 12) : '未固定')} · ${escapeHtml(provenance.dataset_file || '')}</strong></div>
        <div class="fact"><span>官方金标来源</span><strong>${goldSourceLinks || '未提供'}</strong></div>
        <div class="fact"><span>当前复现来源</span><strong>${reproductionSourceLinks || goldSourceLinks || '未提供'}</strong></div>
        <div class="fact"><span>论文</span><strong>${paperUrl ? `<a class="source-link" href="${escapeHtml(paperUrl)}" target="_blank" rel="noopener">查看基准论文</a>` : '未提供'}</strong></div>
        <div class="fact"><span>复现状态</span><strong>${escapeHtml(reproduction.label || '尚未运行')}</strong></div>
        <div class="fact"><span>证据来源</span><strong>${escapeHtml((reproduction.evidence_sources || []).join(', ') || '尚无运行证据')}</strong></div>
        ${reproduction.error ? `<div class="fact"><span>最近错误</span><strong>${escapeHtml(reproduction.error)}</strong></div>` : ''}
      ` : '';
      const reproductionRunPanel = contract.publishable_as_verified ? `
