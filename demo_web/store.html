<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPA Replay Store</title>
  <style>
    :root {
      --ink: #172126;
      --muted: #667277;
      --teal: #245f68;
      --teal-dark: #184a52;
      --teal-soft: #e7f0f0;
      --clay: #c87543;
      --clay-soft: #fbefe7;
      --paper: #fffdf9;
      --canvas: #f4f2ec;
      --line: #d9ddd9;
      --success: #1f7454;
      --danger: #9b3a32;
      --shadow: 0 18px 48px rgba(28, 48, 51, 0.09);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 85% 0%, rgba(200, 117, 67, 0.12), transparent 28rem),
        linear-gradient(180deg, #f8f7f2 0, var(--canvas) 100%);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(36, 95, 104, 0.28);
      outline-offset: 3px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 76px;
      padding: 14px clamp(20px, 5vw, 72px);
      border-bottom: 1px solid rgba(112, 124, 121, 0.2);
      background: rgba(255, 253, 249, 0.9);
      backdrop-filter: blur(18px);
    }

    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid rgba(23, 33, 38, 0.18);
      border-radius: 11px;
      background: linear-gradient(135deg, var(--teal) 0 51%, #d0aa5c 51% 55%, var(--clay) 55%);
      box-shadow: 0 3px 10px rgba(24, 74, 82, 0.14);
    }
    .brand strong { display: block; font-size: 18px; letter-spacing: -0.02em; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

    .product-nav { display: flex; align-items: center; gap: 6px; }
    .product-nav a {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    .product-nav a.active { color: var(--teal-dark); background: var(--teal-soft); }
    .product-nav a:hover { color: var(--ink); }

    .page { width: min(1460px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 72px; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 28px;
      align-items: center;
      margin-bottom: 24px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--clay); }
    h1 { margin: 0; max-width: 680px; font-size: clamp(26px, 2.4vw, 36px); line-height: 1.14; letter-spacing: -0.03em; }
    .hero-copy p { max-width: 620px; margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .hero-note {
      padding: 20px;
      border: 1px solid rgba(36, 95, 104, 0.18);
      border-radius: var(--radius);
      background: rgba(231, 240, 240, 0.72);
    }
    .hero-note strong { display: block; margin-bottom: 7px; font-size: 14px; }
    .hero-note span { color: var(--muted); font-size: 13px; line-height: 1.55; }

    .search-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(36, 95, 104, 0.22);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .search-shell input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
    }
    .primary, .secondary, .ghost {
      min-height: 44px;
      border-radius: 11px;
      padding: 0 17px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .primary { color: white; background: var(--teal); }
    .primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
    .primary:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    .secondary { color: var(--teal-dark); background: var(--teal-soft); border-color: rgba(36, 95, 104, .18); }
    .ghost { color: var(--muted); background: transparent; border-color: var(--line); }

    .catalog-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 26px 0 18px;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 249, .72);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }
    .filter.active { color: white; border-color: var(--teal); background: var(--teal); }
    .result-count { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .store-layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 24px; align-items: start; }
    .catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .record-card {
      position: relative;
      display: grid;
      gap: 14px;
      min-height: 245px;
      padding: 20px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 249, .92);
      color: inherit;
      cursor: pointer;
      box-shadow: 0 7px 24px rgba(28, 48, 51, .04);
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .record-card:hover { transform: translateY(-2px); border-color: rgba(36, 95, 104, .42); box-shadow: var(--shadow); }
    .record-card.active { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(36, 95, 104, .12); }
    .card-top { display: flex; justify-content: space-between; gap: 14px; }
    .category-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--clay-soft);
      color: var(--clay);
      font-weight: 900;
      text-transform: uppercase;
    }
    .card-flags { display: flex; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .saved-pill, .demo-pill { align-self: start; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 850; }
    .saved-pill { background: #e7f4ec; color: var(--success); }
    .demo-pill { background: var(--clay-soft); color: #9a522c; }
    .record-card h2 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.025em; }
    .record-card p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { padding: 5px 8px; border-radius: 7px; background: #f0f1ed; color: #526065; font-size: 11px; font-weight: 750; }
    .card-meta { display: flex; justify-content: space-between; gap: 10px; padding-top: 13px; border-top: 1px solid #eceeea; color: var(--muted); font-size: 12px; }

    .detail-panel {
      position: sticky;
      top: 94px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .detail-empty { padding: 34px; }
    .detail-empty .category-mark { margin-bottom: 18px; }
    .detail-empty h2 { margin: 0 0 10px; font-size: 22px; }
    .detail-empty p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .detail-body { padding: 24px; }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .detail-head h2 { margin: 0; font-size: 25px; line-height: 1.12; letter-spacing: -.035em; }
    .detail-description { margin: 14px 0 18px; color: var(--muted); line-height: 1.65; }
    .detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
    .detail-stat { padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: #faf9f5; }
    .detail-stat span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    .detail-stat strong { display: block; margin-top: 5px; font-size: 18px; }
    .facts { display: grid; gap: 9px; margin: 20px 0; }
    .fact { display: grid; grid-template-columns: 88px 1fr; gap: 12px; font-size: 12px; line-height: 1.45; }
    .fact span:first-child { color: var(--muted); }
    .save-area { padding: 18px 24px 24px; border-top: 1px solid var(--line); background: #fbfaf6; }
    .save-area .primary { width: 100%; }
    .safe-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .open-replay {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: var(--teal);
      color: white;
      text-decoration: none;
      font-weight: 850;
    }
    .open-replay:hover { background: var(--teal-dark); }
    .saved-note { margin: 0 0 12px; color: var(--success); font-size: 13px; font-weight: 800; }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 310px;
      display: grid;
      place-items: center;
      padding: 38px;
      border: 1px dashed #bdc5c1;
      border-radius: var(--radius);
      background: rgba(255, 253, 249, .62);
      text-align: center;
    }
    .empty-state h2 { margin: 12px 0 8px; font-size: 22px; }
    .empty-state p { max-width: 470px; margin: 0; color: var(--muted); line-height: 1.6; }

    .feedback { margin-top: 12px; padding: 11px 13px; border-radius: 10px; background: var(--teal-soft); color: var(--teal-dark); font-size: 12px; line-height: 1.5; }
    .feedback.error { color: var(--danger); background: #fae9e7; }

    .publisher { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 24px; }
    .publisher summary { width: fit-content; cursor: pointer; color: var(--teal-dark); font-size: 14px; font-weight: 850; }
    .publisher-card { margin-top: 14px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255, 253, 249, .8); }
    .publisher-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .publisher-grid input, .publisher-grid select {
      min-height: 42px;
      width: 100%;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
    }
    .privacy { display: flex; gap: 9px; align-items: flex-start; margin: 14px 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .privacy input { margin-top: 2px; }
    .publisher-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    @media (max-width: 1080px) {
      .store-layout { grid-template-columns: 1fr; }
      .detail-panel { position: static; }
      .publisher-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 760px) {
      .site-header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .product-nav { width: 100%; }
      .product-nav a { flex: 1; justify-content: center; }
      .page { width: min(100% - 24px, 1460px); padding-top: 34px; }
      .hero { grid-template-columns: 1fr; }
      .catalog-grid { grid-template-columns: 1fr; }
      .catalog-toolbar { align-items: flex-start; flex-direction: column; }
      .publisher-grid { grid-template-columns: 1fr; }
      .search-shell { grid-template-columns: 1fr; }
      .search-shell button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/store" aria-label="GPA Replay Store 首页">
      <span class="mark" aria-hidden="true"></span>
      <span><strong>GPA Replay Store</strong><span>社区工作流目录</span></span>
    </a>
    <nav class="product-nav" aria-label="产品导航">
      <a class="active" href="/store">Replay Store</a>
      <a href="/">Replay Studio</a>
    </nav>
  </header>

  <main class="page">
    <section class="hero" aria-labelledby="storeTitle">
      <div class="hero-copy">
        <div class="eyebrow">Community replays</div>
        <h1 id="storeTitle">发现可复用的 Replay</h1>
        <p>查看详情，保存到“我的回放”后再配置运行。</p>
      </div>
      <aside class="hero-note">
        <strong>保存后不会自动运行</strong>
        <span>请在“我的回放”中检查变量与目标应用。</span>
      </aside>
    </section>

    <section aria-label="搜索 Replay Store">
      <div class="search-shell">
        <input id="storeSearch" type="search" placeholder="搜索任务、应用、作者或标签" autocomplete="off">
        <button class="primary" id="refreshStore">搜索商店</button>
      </div>
      <div class="catalog-toolbar">
        <div class="filters" id="categoryFilters" aria-label="分类筛选"></div>
        <div class="result-count" id="resultCount">正在载入工作流…</div>
      </div>
    </section>

    <section class="store-layout" aria-label="Replay Store 目录">
      <div class="catalog-grid" id="catalogGrid"></div>
      <aside class="detail-panel" id="recordDetail" aria-live="polite">
        <div class="detail-empty">
          <div class="category-mark">GPA</div>
          <h2>选择一个工作流</h2>
          <p>这里会显示作者、许可证、步骤数量、平台信息和社区反馈。</p>
        </div>
      </aside>
    </section>

    <details class="publisher" id="publisherPanel">
      <summary>分享一个工作流到 Replay Store</summary>
      <div class="publisher-card">
        <div class="publisher-grid">
          <select id="publishWorkflow" aria-label="选择本地工作流"><option value="">选择本地工作流</option></select>
          <input id="publishAuthor" placeholder="发布者名称" value="Anonymous">
          <input id="publishTags" placeholder="标签，逗号分隔">
          <select id="publishLicense" aria-label="许可证">
            <option value="CC-BY-4.0">CC-BY-4.0</option>
            <option value="CC0-1.0">CC0-1.0</option>
            <option value="MIT">MIT</option>
            <option value="Apache-2.0">Apache-2.0</option>
          </select>
        </div>
        <label class="privacy">
          <input type="checkbox" id="publishPrivacy">
          <span>我已检查包中的 OCR 文本、变量默认值、应用名和视觉数据，同意公开发布。</span>
        </label>
        <div class="publisher-actions">
          <button class="secondary" id="publishLocal">发布所选工作流</button>
          <button class="ghost" id="uploadPackage">上传 Replay 插件</button>
          <input type="file" id="packageFile" accept=".zip,.gpa-record.zip,application/zip" hidden>
        </div>
        <div id="publishFeedback" aria-live="polite"></div>
      </div>
    </details>
  </main>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8765' : '';
    const state = { records: [], selectedId: null, selected: null, query: '', tag: '', selectionVersion: 0 };
    const els = {
      search: document.getElementById('storeSearch'),
      refresh: document.getElementById('refreshStore'),
      filters: document.getElementById('categoryFilters'),
      count: document.getElementById('resultCount'),
      grid: document.getElementById('catalogGrid'),
      detail: document.getElementById('recordDetail'),
      publishWorkflow: document.getElementById('publishWorkflow'),
      publishAuthor: document.getElementById('publishAuthor'),
      publishTags: document.getElementById('publishTags'),
      publishLicense: document.getElementById('publishLicense'),
      publishPrivacy: document.getElementById('publishPrivacy'),
      publishLocal: document.getElementById('publishLocal'),
      uploadPackage: document.getElementById('uploadPackage'),
      packageFile: document.getElementById('packageFile'),
      publishFeedback: document.getElementById('publishFeedback'),
      publisherPanel: document.getElementById('publisherPanel'),
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[char]));
    }

    async function getJson(path, options) {
      const response = await fetch(`${API_BASE}${path}`, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok === false) throw new Error(data.error || response.statusText);
      return data;
    }

    function postJson(path, payload = {}) {
      return getJson(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    }

    function initials(record) {
      const source = (record.tags || [])[0] || record.workflow_title || record.workflow_name || 'GPA';
      return String(source).slice(0, 3).toUpperCase();
    }

    function showPublishFeedback(message, kind = '') {
      els.publishFeedback.innerHTML = message
        ? `<div class="feedback ${kind}">${escapeHtml(message)}</div>`
        : '';
    }

    function publishOptions() {
      return {
        author: els.publishAuthor.value.trim() || 'Anonymous',
        tags: els.publishTags.value.split(',').map(tag => tag.trim()).filter(Boolean),
        record_license: els.publishLicense.value,
        privacy_reviewed: els.publishPrivacy.checked,
      };
    }

    async function loadStore({ preserveSelection = true } = {}) {
      const data = await getJson('/api/community/records');
      state.records = data.records || [];
      renderFilters();
      renderCatalog();
      if (preserveSelection && state.selectedId && state.records.some(record => record.record_id === state.selectedId)) {
        await selectRecord(state.selectedId, { preserveCatalog: true });
      }
    }

    async function loadLocalWorkflows() {
      const data = await getJson('/api/workflows');
      const workflows = data.workflows || [];
      els.publishWorkflow.innerHTML = '<option value="">选择本地工作流</option>' + workflows.map(workflow => (
        `<option value="${escapeHtml(workflow.id)}">${escapeHtml(workflow.title || workflow.name)} · ${escapeHtml(workflow.id)}</option>`
      )).join('');
      const publishId = new URLSearchParams(window.location.search).get('publish');
      if (publishId && workflows.some(workflow => workflow.id === publishId)) {
        els.publishWorkflow.value = publishId;
        els.publisherPanel.open = true;
      }
    }

    function filteredRecords() {
      const query = state.query.trim().toLowerCase();
      return state.records.filter(record => {
        const matchesTag = !state.tag || (record.tags || []).includes(state.tag);
        const haystack = [
          record.workflow_title, record.workflow_name, record.description,
          record.task_description, record.author, ...(record.tags || []),
        ].join(' ').toLowerCase();
        return matchesTag && (!query || haystack.includes(query));
      });
    }

    function renderFilters() {
      const tags = [...new Set(state.records.flatMap(record => record.tags || []))].sort().slice(0, 8);
      const items = [{ value: '', label: '全部' }, ...tags.map(tag => ({ value: tag, label: tag }))];
      els.filters.innerHTML = items.map(item => (
        `<button class="filter ${state.tag === item.value ? 'active' : ''}" data-tag="${escapeHtml(item.value)}">${escapeHtml(item.label)}</button>`
      )).join('');
      els.filters.querySelectorAll('[data-tag]').forEach(button => {
        button.addEventListener('click', () => {
          state.tag = button.dataset.tag || '';
          renderFilters();
          renderCatalog();
        });
      });
    }

    function renderCatalog() {
      const records = filteredRecords();
      els.count.textContent = `${records.length} 个可用工作流`;
      els.grid.innerHTML = records.map(record => {
        const feedbackCount = Number(record.stats?.feedback_count || 0);
        const rate = feedbackCount ? `${Math.round(Number(record.stats?.success_rate || 0) * 100)}%` : '暂无反馈';
        const tags = (record.tags || []).slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
        return `
          <button class="record-card ${state.selectedId === record.record_id ? 'active' : ''}" data-record-id="${escapeHtml(record.record_id)}">
            <div class="card-top">
              <span class="category-mark">${escapeHtml(initials(record))}</span>
              <span class="card-flags">
                ${(record.tags || []).includes('demo') ? '<span class="demo-pill">示例</span>' : ''}
                ${record.saved_workflow_id ? '<span class="saved-pill">已保存</span>' : ''}
              </span>
            </div>
            <div>
              <h2>${escapeHtml(record.workflow_title || record.workflow_name)}</h2>
              <p>${escapeHtml(record.description || record.task_description || '社区共享工作流')}</p>
            </div>
            <div class="tag-row">${tags || '<span class="tag">general</span>'}</div>
            <div class="card-meta">
              <span>${escapeHtml(record.author || 'Anonymous')}</span>
              <span>${escapeHtml(record.step_count || 0)} steps · ${escapeHtml(rate)}</span>
            </div>
          </button>
        `;
      }).join('') || `
        <div class="empty-state">
          <div>
            <div class="category-mark" style="margin:auto">0</div>
            <h2>还没有匹配的工作流</h2>
            <p>${state.records.length ? '换一个关键词或分类试试。' : 'Replay Store 目前为空。你可以在页面底部分享第一个本地工作流。'}</p>
          </div>
        </div>
      `;
      els.grid.querySelectorAll('[data-record-id]').forEach(card => {
        card.addEventListener('click', () => selectRecord(card.dataset.recordId).catch(error => renderDetailError(error.message)));
      });
    }

    async function selectRecord(recordId, { preserveCatalog = false } = {}) {
      const requestVersion = ++state.selectionVersion;
      state.selectedId = recordId;
      state.selected = null;
      if (!preserveCatalog) renderCatalog();
      els.detail.innerHTML = '<div class="detail-empty"><div class="category-mark">···</div><h2>正在读取工作流</h2><p>正在校验社区元数据与保存状态。</p></div>';
      let data;
      try {
        data = await getJson(`/api/community/records/${encodeURIComponent(recordId)}`);
      } catch (error) {
        if (requestVersion !== state.selectionVersion || state.selectedId !== recordId) return;
        throw error;
      }
      if (requestVersion !== state.selectionVersion || state.selectedId !== recordId) return;
      state.selected = data.record;
      renderDetail();
      renderCatalog();
    }

    function renderDetailError(message) {
      els.detail.innerHTML = `<div class="detail-empty"><div class="category-mark">!</div><h2>无法打开工作流</h2><p>${escapeHtml(message)}</p></div>`;
    }

    function renderDetail() {
      const record = state.selected;
      if (!record) return;
      const stats = record.stats || {};
      const feedbackCount = Number(stats.feedback_count || 0);
      const rate = feedbackCount ? `${Math.round(Number(stats.success_rate || 0) * 100)}%` : '—';
      const platform = record.platform || {};
      const tags = (record.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
      const savedId = record.saved_workflow_id || '';
      els.detail.innerHTML = `
        <div class="detail-body">
          <div class="detail-head">
            <div><div class="eyebrow">${(record.tags || []).includes('demo') ? 'Example replay' : 'Replay plugin'}</div><h2>${escapeHtml(record.workflow_title || record.workflow_name)}</h2></div>
            <span class="category-mark">${escapeHtml(initials(record))}</span>
          </div>
          <p class="detail-description">${escapeHtml(record.description || '没有提供说明。')}</p>
          <div class="tag-row">${tags || '<span class="tag">general</span>'}</div>
          <div class="detail-stats">
            <div class="detail-stat"><span>Steps</span><strong>${escapeHtml(record.step_count || 0)}</strong></div>
            <div class="detail-stat"><span>Saves</span><strong>${escapeHtml(stats.imports || 0)}</strong></div>
            <div class="detail-stat"><span>Success</span><strong>${escapeHtml(rate)}</strong></div>
          </div>
          <div class="facts">
            <div class="fact"><span>作者</span><strong>${escapeHtml(record.author || 'Anonymous')}</strong></div>
            <div class="fact"><span>许可证</span><strong>${escapeHtml(record.record_license || '未声明')}</strong></div>
            <div class="fact"><span>目标</span><strong>${escapeHtml(record.task_description || '未提供')}</strong></div>
            <div class="fact"><span>变量</span><strong>${escapeHtml((record.variable_names || []).join(', ') || '无')}</strong></div>
            <div class="fact"><span>平台</span><strong>${escapeHtml([platform.system, platform.release, platform.machine].filter(Boolean).join(' · ') || '未知')}</strong></div>
          </div>
        </div>
        <div class="save-area">
          ${savedId ? `
            <p class="saved-note">已保存到“我的回放”</p>
            <a class="open-replay" href="/?workflow_id=${encodeURIComponent(savedId)}">进入我的回放</a>
          ` : `
            <p class="safe-note">保存只会创建本地副本，不会启动回放。</p>
            <button class="primary" id="saveRecord">保存到我的回放</button>
          `}
          <div id="saveFeedback" aria-live="polite"></div>
        </div>
      `;
      document.getElementById('saveRecord')?.addEventListener('click', () => saveSelectedRecord().catch(error => showSaveFeedback(error.message, 'error')));
    }

    function showSaveFeedback(message, kind = '') {
      const target = document.getElementById('saveFeedback');
      if (target) target.innerHTML = `<div class="feedback ${kind}">${escapeHtml(message)}</div>`;
    }

    async function saveSelectedRecord() {
      const record = state.selected;
      if (!record || record.record_id !== state.selectedId) return;
      const recordId = record.record_id;
      const version = state.selectionVersion;
      const button = document.getElementById('saveRecord');
      if (button) { button.disabled = true; button.textContent = '正在保存…'; }
      try {
        const data = await postJson(`/api/community/records/${encodeURIComponent(recordId)}/import`, {});
        if (version !== state.selectionVersion || state.selectedId !== recordId) return;
        state.selected.saved_workflow_id = data.workflow_id;
        const summary = state.records.find(item => item.record_id === recordId);
        if (!data.already_saved) {
          const nextImports = Number(state.selected.stats?.imports || 0) + 1;
          state.selected.stats = { ...(state.selected.stats || {}), imports: nextImports };
          if (summary) summary.stats = { ...(summary.stats || {}), imports: nextImports };
        }
        if (summary) summary.saved_workflow_id = data.workflow_id;
        renderCatalog();
        renderDetail();
        showSaveFeedback(data.already_saved ? '这个工作流已经在“我的回放”中。' : '保存成功，可以进入个人回放页继续配置。');
        await loadLocalWorkflows();
      } catch (error) {
        if (version === state.selectionVersion && state.selectedId === recordId && button) {
          button.disabled = false;
          button.textContent = '保存到我的回放';
        }
        throw error;
      }
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      const chunks = [];
      const chunkSize = 0x8000;
      for (let offset = 0; offset < bytes.length; offset += chunkSize) {
        chunks.push(String.fromCharCode(...bytes.subarray(offset, offset + chunkSize)));
      }
      return btoa(chunks.join(''));
    }

    async function publishLocalWorkflow() {
      const workflowId = els.publishWorkflow.value;
      const options = publishOptions();
      if (!workflowId) throw new Error('请先选择一个本地工作流。');
      if (!options.privacy_reviewed) throw new Error('发布前必须确认隐私审查。');
      showPublishFeedback('正在校验并发布…');
      const data = await postJson('/api/community/records', { ...options, workflow_id: workflowId });
      els.publishPrivacy.checked = false;
      showPublishFeedback(data.record.duplicate ? '相同内容已经存在，已打开原记录。' : '工作流已发布到 Replay Store。');
      await loadStore({ preserveSelection: false });
      await selectRecord(data.record.record_id);
    }

    async function uploadCommunityPackage(file) {
      if (!file) return;
      const options = publishOptions();
      if (!options.privacy_reviewed) throw new Error('上传前必须确认隐私审查。');
      if (file.size > 64 * 1024 * 1024) throw new Error('社区包不能超过 64 MiB。');
      showPublishFeedback(`正在上传 ${file.name}…`);
      const data = await postJson('/api/community/records', {
        ...options,
        package_base64: arrayBufferToBase64(await file.arrayBuffer()),
      });
      els.publishPrivacy.checked = false;
      els.packageFile.value = '';
      showPublishFeedback(data.record.duplicate ? '相同社区包已经存在。' : '社区包已发布。');
      await loadStore({ preserveSelection: false });
      await selectRecord(data.record.record_id);
    }

    els.search.addEventListener('input', () => {
      state.query = els.search.value;
      renderCatalog();
    });
    els.refresh.addEventListener('click', () => loadStore().catch(error => renderDetailError(error.message)));
    els.publishLocal.addEventListener('click', () => publishLocalWorkflow().catch(error => showPublishFeedback(error.message, 'error')));
    els.uploadPackage.addEventListener('click', () => els.packageFile.click());
    els.packageFile.addEventListener('change', () => uploadCommunityPackage(els.packageFile.files?.[0]).catch(error => {
      showPublishFeedback(error.message, 'error');
      els.packageFile.value = '';
    }));

    Promise.allSettled([loadStore(), loadLocalWorkflows()]).then(results => {
      const failure = results.find(result => result.status === 'rejected');
      if (failure) renderDetailError(failure.reason?.message || failure.reason);
    });
  </script>
</body>
</html>
