name: Desktop compatibility smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read

jobs:
  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GPA_ENABLE_DESKTOP_AUTOMATION: "0"
      GPA_KEYBOARD_QUARANTINE_SECONDS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[desktop,cloud,package,dev]"
      - name: Validate native shell and loopback service
        run: |
          gpa-desktop --check
          ./start.sh --check --skip-install
          python -m unittest tests.test_desktop_app tests.test_replay_server_api tests.test_server_recovery
      - name: Build and verify install image
        if: matrix.python-version == '3.13'
        env:
          GPA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./scripts/build_macos_app.sh
          ./scripts/verify_macos_artifact.sh artifacts/GPA-macOS.dmg
